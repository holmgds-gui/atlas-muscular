<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Muscle Atlas</title>
<meta name="description" content="Boneco anatômico clicável com exercícios ordenados por estudos de EMG.">
<meta name="theme-color" content="#0E1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscle Atlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: figure stage on the left (top on phones), ranked exercise panel on the right (below on phones). */
:root{
  --bg:#E9ECEF; --surface:#F7F8F9; --ink:#1A1F26; --muted:#5B6470; --line:#CDD2D8;
  --skin:#D6DADF; --fig-skin:#CDD3DA; --fig-art:#DCE0E5; --fig-art2:#C9D0D7; --m:#AEB6C0; --m-hi:#C3CAD2; --m-lo:#97A0AB; --m-edge:#E9ECEF; --fiber:rgba(26,31,38,.13);
  --target:#D3222A; --target-hi:#F04A50; --target-lo:#A0141B;
  --syn:#F08A24; --syn-soft:rgba(240,138,36,.55);
  --chip:#E1E5E9; --focus:#1A1F26; --tend:#E4E7EB; --k1:#D3222A; --k2:#2F6DB5; --band:rgba(26,31,38,.08); --hair:#6B737E; --hair-l:rgba(255,255,255,.22); --breast:rgba(255,255,255,.2); --fold:rgba(26,31,38,.16);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --fig-skin:#5E6976; --fig-art:#2F3741; --fig-art2:#3A444F; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; --k1:#F0474D; --k2:#5B8FDB; --band:rgba(255,255,255,.09); --hair:#262D35; --hair-l:rgba(255,255,255,.08); --breast:rgba(255,255,255,.06); --fold:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --fig-skin:#5E6976; --fig-art:#2F3741; --fig-art2:#3A444F; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; --k1:#F0474D; --k2:#5B8FDB; --band:rgba(255,255,255,.09); --hair:#262D35; --hair-l:rgba(255,255,255,.08); --breast:rgba(255,255,255,.06); --fold:rgba(0,0,0,.35); color-scheme:dark}

html{height:100%;touch-action:pan-x pan-y}body{height:100%;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--accent,var(--target));font-weight:700}
.brand .logo{width:36px;height:36px;flex:none;display:block;align-self:center;margin:-4px 0}
@media (max-width:480px){.brand .logo{width:32px;height:32px}}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
/* search: only a magnifier in the header (owner's request); tapping it opens the field over the header */
header{position:relative}
.search{margin-left:auto;flex:none;display:flex;align-items:center;gap:2px}
.sbtn svg{stroke:currentColor;fill:none;stroke-width:2}
.sfield{display:none;position:absolute;z-index:25;top:0;bottom:0;right:max(16px,env(safe-area-inset-right,0px));width:min(440px,calc(100% - 32px));align-items:center;gap:6px;background:var(--surface)}
.search.open .sfield{display:flex}
.sfield input{flex:1;min-width:0;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:16px;color:var(--ink)}
.sfield .smag{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.sfield input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.sclose{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:18px}
.sclose:hover{background:var(--chip);color:var(--ink)}
.gear{flex:none;display:grid;place-items:center;width:40px;height:40px;margin-right:-6px;border:0;border-radius:10px;background:none;color:var(--muted);padding:0}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear:hover,.gear[aria-current="page"]{background:var(--chip);color:var(--ink)}
/* Hoje › Ao vivo */
.hview{margin:4px 0 12px}
.lv-pick{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.lv-pick .pn,.lv-pick .ps{grid-column:1}.lv-pick b{grid-column:2;grid-row:1/3;font-size:18px;color:var(--target)}
.lv-pick:disabled{opacity:.5}
.card.lv-top{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:12px;padding-block:12px}
.lv-clock{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.lv-rest .row{gap:6px}.lv-big{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.lv-rest.on .lv-big{color:var(--target)}
.lv-bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:10px}.lv-bar i{display:block;height:100%;background:var(--target);transition:width 1s linear}
.lv-rsel{display:flex;gap:6px;margin-top:10px}.lv-rsel button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:5px 0;font-size:13px;color:var(--muted)}
.lv-rsel button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lv-name{font-size:22px;margin-top:4px}
.lv-sug{margin-top:8px;font-size:14px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:7px 10px}
.lv-sug.up{color:var(--target)}
.lv-tips{margin-top:8px;font-size:13px;display:grid;gap:4px;color:var(--ink)}.lv-tips b{font-weight:600}
.lv-rnote{display:block;margin-top:8px}
.lv-setn{margin-top:12px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-size:14px}
/* treinos prontos */
.seg.fview{display:flex;width:100%;margin:10px 0 12px}.seg.fview button{flex:1}
.seg.rt-lv{display:flex;width:100%;margin:12px 0 4px}.seg.rt-lv button{flex:1}
.rt-lvt{margin:4px 2px 12px}.rt-fl{margin:4px 2px 6px}.rt-chips{margin:0 0 14px;padding:0 0 4px}
.rt-how{padding:12px 16px}.rt-how summary,.rt-more summary{cursor:pointer;font-weight:600}.rt-how ul,.rt-more ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;line-height:1.4;font-size:14px}
.rt-sp{display:grid;gap:8px}.rt-sp .section-t{margin:0}.rt-d{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.rt-more{font-size:14px}.rt-week{font-size:13px;line-height:1.5;background:var(--chip);border-radius:12px;padding:10px 12px;display:grid;gap:8px}.rt-week .btn{justify-self:start}
.rt-w{border:1px solid var(--line);border-radius:12px;background:var(--bg)}.rt-w.open{border-color:var(--ink)}
.rt-wh{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:none;padding:10px 12px;color:var(--ink);font:inherit}
.rt-wh>span:first-child{display:grid;gap:2px}.rt-wh .muted-s{margin:0}.rt-wh .chev{font-size:16px;color:var(--muted);flex:none}
.rt-list{margin:0;padding:0 12px 4px 32px;display:grid;gap:6px;font-size:14px}.rt-list li span{margin-right:6px}.rt-list li b{white-space:nowrap;color:var(--muted);font-weight:600}
.rt-w .row{padding:6px 12px 12px;flex-wrap:wrap}
.lv-inps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.lv-inps label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.kgh.kgb{text-align:center;margin-top:4px}
.lv-inps label>span,.rk-inps label>span{display:flex;align-items:center;height:18px}
#hBody ul+p{margin-top:12px}
.kgh{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;line-height:1.25;margin-top:1px}
.set.set-h span .help.sm,.rk-inps .help.sm{width:16px;height:16px;font-size:16px}
.lv-inps .inp{font-size:26px;font-weight:600;padding:10px 12px;width:100%;box-sizing:border-box;text-align:center}
.lv-done{margin-top:10px;font-size:17px;padding:14px}
.lv-sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv-sets button{min-width:52px;border:1px solid var(--line);background:none;border-radius:10px;padding:6px 8px;font-weight:600;color:var(--ink);display:grid;justify-items:center}
.lv-sets button small{font-weight:500;font-size:11px;color:var(--muted)}
.lv-sets button.ok{background:var(--chip)}.lv-sets button.cur{border-color:var(--target);box-shadow:0 0 0 1px var(--target)}
.lv-tools{margin-top:8px}
.lv-list{display:grid;gap:6px;margin:8px 0 10px}
.lv-list button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:none;border-radius:10px;padding:9px 12px;color:var(--ink)}
.lv-list button.cur{border-color:var(--target)}.lv-list button.ok b{color:#2FA866}
.lv-sum{text-align:center}.lv-sum h3{margin:6px 0 10px;font-family:var(--f-display);font-size:28px;letter-spacing:.03em;text-transform:uppercase}
.lv-trophy{font-size:44px}
.lv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.lv-stats b{display:block;font-family:var(--f-display);font-size:28px}.lv-stats span{font-size:12px;color:var(--muted)}
.lv-prs{text-align:left;padding-left:0;list-style:none;display:grid;gap:6px;margin:0 0 8px}
.pr-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--target);margin-right:8px;vertical-align:middle}
.restpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;align-items:center;gap:6px;background:var(--target);color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
.restpill[hidden]{display:none}
.restpill button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:5px 10px;font-weight:600}
@media (max-width:900px){.restpill{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
/* como fazer, montar treino, programas */
details.how{margin-top:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.how ol,details.how ul{margin:4px 0 8px;padding-left:20px;display:grid;gap:3px;line-height:1.4}
.how p{margin:2px 0 8px;line-height:1.45}.how .how-l{display:block;margin-top:6px}
.how-v{background:var(--chip);border-radius:10px;padding:6px 10px 2px;margin:4px 0 8px}.how-v .how-l{margin-top:0}
.how-c{background:color-mix(in srgb,var(--target) 10%,transparent);border-radius:10px;padding:8px 10px}.how-c b{color:var(--ink)}
details.how b{font-size:13px;color:var(--muted)}
.ex details.how{grid-column:1/-1}
.buildbtn{white-space:nowrap}
.buildbar{display:flex;flex-direction:column;gap:6px;flex:none}
.buildbar .btn{padding:6px 12px;font-size:14px;min-height:0}
.buildbar[hidden]{display:none}
.bb-t b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--target)}
.bb-t span{font-size:13px;color:var(--muted)}
.blist{padding-left:20px;display:grid;gap:8px;margin:10px 0 14px}.blist span{display:block;font-size:12px;color:var(--muted)}
.prog{margin:10px 0}.prog-w{margin-bottom:8px;font-size:14px}.prog-w .ps{display:block}
/* conquistas, Stories */
.card.ach-top{display:flex;flex-direction:row;align-items:center;gap:14px}.ach-fire{font-size:46px}
.ach-n{font-family:var(--f-display);font-size:44px;line-height:1;margin-right:6px}.ach-top span{font-weight:600}.ach-top small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ach-sec{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:6px}.ach-sec span{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}.ach-sd{margin:-4px 0 10px;font-size:12px;color:var(--muted)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:3px;opacity:.55;filter:grayscale(1)}
.ach.ok{opacity:1;filter:none;border-color:var(--target)}.ach-i{font-size:26px}.ach b{font-size:14px}.ach small{font-size:11px;color:var(--muted);line-height:1.3}
.ach em{position:absolute;top:8px;right:10px;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}.ach.ok em{color:var(--target)}
.ach-bar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden;margin-top:4px}.ach-bar i{display:block;height:100%;background:var(--target)}
.streak{color:var(--target);font-weight:700}
.card-prev{display:block;width:min(260px,70%);margin:0 auto 10px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.rk-share{background:rgba(255,255,255,.12);color:inherit;border-color:rgba(255,255,255,.2)}
/* configurações */
.cf{gap:0;padding-block:4px}
.cf-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cf>.cf-row:first-child{border-top:0}
.cf-l{min-width:0;display:grid;gap:2px}.cf-l b{font-weight:600;font-size:15px}.cf-l small{color:var(--muted);font-size:12px;line-height:1.35}
.cf-l .pill{vertical-align:2px;margin-left:4px}
.cf-c{flex:none;max-width:62%;display:flex;justify-content:flex-end}
.cf-in{width:auto;max-width:180px}.cf-in.sm{width:74px;text-align:center}.cf-in.xs{width:48px;text-align:center}
.cf-unit{display:flex;align-items:center;gap:6px}.cf-unit small{color:var(--muted);font-size:13px}
.cf-seg{flex-wrap:wrap;justify-content:flex-end}.cf-seg button{padding:6px 10px;font-size:13px}
.cf-seg button:disabled{opacity:.4;cursor:default}
.cf-dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cf-dots button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.cf-dots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.cf-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 0 12px}
.cf-days{display:flex;gap:4px}.cf-days button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--muted);padding:0}
.cf-days button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cf .confirm{padding:0 0 12px}
.cf-row.st{flex-direction:column;align-items:stretch;gap:8px}.cf-row.st .cf-c{max-width:none;justify-content:flex-start}
.cf-row.st .cf-seg{display:flex;width:100%;flex-wrap:nowrap}.cf-row.st .cf-seg button{flex:1;padding:7px 4px}
.seg.cf-seg button{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:600}
.cf-row.st .cf-dots{justify-content:flex-start}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--accent,var(--target))}.sw input:checked+i::after{transform:translateX(18px)}
.sw input:disabled+i{opacity:.45}.sw input:focus-visible+i{outline:2px solid var(--focus);outline-offset:2px}
html.noanim *,html.noanim *::before,html.noanim *::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
@media (max-width:400px){header{gap:8px}.gear{width:34px;margin-right:-4px}.sbtn{margin-right:0}.sfield input{padding-right:6px}}
.results{position:absolute;left:0;right:0;top:calc(100% - 2px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .r-n{font-weight:600;font-size:14px}
.results .r-s{font-size:12px;color:var(--muted)}
.results .empty{padding:12px 14px;color:var(--muted);font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgl{border:0;background:var(--chip);border-radius:10px;padding:9px 16px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);min-width:96px}
.tgl-sex{min-width:0;display:inline-grid;place-items:center;padding:8px 14px}.tgl-sex svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tgl:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.zoom{display:inline-flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:36px;height:36px;font-weight:600;font-size:16px;display:inline-grid;place-items:center;padding:0 8px}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}

.canvas{flex:1;min-height:0;position:relative}
#fig{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}

/* figure */
.skin{fill:var(--fig-skin)}
.ext{fill:var(--fig-skin);stroke:none}
.xline{fill:none;stroke:var(--m);stroke-width:1.2;stroke-linecap:round;pointer-events:none}
.deco{pointer-events:none}
.dm{fill:var(--m);stroke:var(--fig-skin);stroke-width:1.6;stroke-linejoin:round}
.tend{fill:var(--fig-skin);stroke:none;pointer-events:none}
.hair{fill:var(--hair);stroke:var(--m-edge);stroke-width:1.2;pointer-events:none}
.hair-l{fill:none;stroke:var(--hair-l);stroke-width:1.3;stroke-linecap:round;pointer-events:none}
.breast{fill:var(--breast);stroke:none;pointer-events:none}
.bfold{fill:none;stroke:var(--fold);stroke-width:2.4;stroke-linecap:round;pointer-events:none}
.seg.sex button{display:inline-grid;place-items:center;padding:6px 14px}
.seg.sex svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){#zIn,#zOut{display:none}}
.mode-art .skin,.mode-art .ext,.mode-art .tend{fill:var(--fig-art)}
.mode-art .dm{fill:var(--fig-art2);stroke:var(--fig-art)}
.mode-art .hair,.mode-art .breast,.mode-art .bfold{opacity:.6}
.m{fill:var(--m);stroke:var(--fig-skin);stroke-width:1.6;stroke-linejoin:round;transition:fill .18s}
.fib{fill:none;stroke:var(--fiber);stroke-width:.7;stroke-linecap:round;pointer-events:none}
@media (hover:hover){[data-m]:hover .m{fill:var(--m-hi)}}
[data-m].on .m{fill:url(#gT)}
[data-m].syn .m{fill:url(#gS)}
.vlabel{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.2em;fill:var(--muted)}
.detail{fill:none;stroke:var(--m-edge);stroke-width:1.4;pointer-events:none}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-top > div{min-width:0;flex:1}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--target)}
.eyebrow-row{display:flex;align-items:center;gap:8px}
.help{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;padding:0;border:0;background:none;color:var(--muted);font-family:var(--f-body);font-size:22px;font-weight:500;line-height:1;letter-spacing:0;vertical-align:middle;cursor:pointer;position:relative}
.help::after{content:"";position:absolute;inset:-10px}
.page-h h2 .help{margin-left:10px;transform:translateY(-3px)}
.help.sm{width:18px;height:18px;font-size:18px;margin-left:4px}
.kgsl{display:inline-flex;align-items:center}
.helpb{overflow:auto;padding:0 16px 22px;font-size:15px;line-height:1.5}
.helpb p{margin:0 0 6px}
.helpb h4{margin:14px 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.helpb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.p-title{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.02;text-wrap:balance}
.p-latin{margin:4px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.clear{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.p-body{flex:1;overflow:auto;padding:14px 18px 24px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.status{font-size:13px;color:var(--muted);line-height:1.4}
.status b{color:var(--syn)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ex:hover{border-color:var(--muted)}
.ex.sel{border-color:var(--syn);box-shadow:inset 0 0 0 1px var(--syn)}
.rank{grid-row:span 3;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}
.ex[data-i="0"] .rank{color:var(--target)}
.ex-n{font-weight:600;font-size:15px;line-height:1.25}
.ex-en{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 7px;background:var(--chip);color:var(--muted)}
.tag.hyp{background:var(--target);color:#fff}
.tag.emg{background:var(--ink);color:var(--surface)}
.tag.bio{background:none;border:1px solid var(--line)}
.tag.stat{background:none;color:var(--target);border:1px solid var(--target)}
.syns{grid-column:2;display:none;flex-wrap:wrap;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.ex.sel .syns{display:flex}
.syns span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--syn-soft);color:var(--ink)}
.syns em{font-style:normal;font-size:12px;color:var(--muted);width:100%}

.note{font-size:13px;color:var(--muted);line-height:1.45;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.empty button{margin-top:10px;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 12px}

.groups{display:grid;gap:16px}
.group h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group div{display:flex;flex-wrap:wrap;gap:6px}
.group button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.group button:hover{border-color:var(--target)}

details.about{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:13px;color:var(--muted)}
details.about summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.about ul{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
details.about p{margin:8px 0 0;line-height:1.45}

/* phones and narrow windows */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .seg .both{display:none}
  .legend{display:none}
  .brand small{display:none}
  .p-head{padding:12px 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-title{font-size:24px}
  .bar{padding-block:8px}
  .hint{display:none}
  main{grid-template-rows:minmax(320px,56%) minmax(0,1fr)}
}
@media (max-width:480px){.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){.m{transition:none}}

/* ---- sections, tabs, pages ---- */

.view{grid-row:2;min-height:0}
.htabs{display:flex;gap:4px}
.htabs button,.btabs button{border:0;background:none;color:var(--muted);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.htabs button{padding:7px 12px;border-radius:8px;font-size:15px}
.htabs button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.btabs{display:none}
.page{overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;box-sizing:border-box;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.page-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.02em;line-height:1}

.day-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.inp{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}

.title-inp{font-family:var(--f-display);font-weight:700;font-size:22px;padding:6px 10px}

.fi-n{font-weight:600;font-size:15px;align-self:center;min-width:0;line-height:1.25}
.muted-s{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}

.ib{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;font-size:15px;padding:0}

.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--target);border-color:var(--target);background:none}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.wx-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wx-h > div:first-child{min-width:0}
.wx-n{font-weight:600;font-size:16px;line-height:1.25}
.last{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px;line-height:1.4}
.last b{color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.set-n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set.set-h span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hist{display:grid;gap:6px}
.hist button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}
.hist b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- sheets ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.25)}

/* ---- exercise card add button ---- */

/* ---- models ---- */

.jl{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

}

.wkrow .ib{width:28px;height:44px;font-size:18px}
.wkrow .ib:disabled{opacity:.3}
.pastbox{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--surface)}
.pastbox b{display:block;font-size:15px}
.pastbox span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.wk.did span{border-top-color:color-mix(in srgb,var(--target) 35%,transparent)}
.wk.today{box-shadow:inset 0 0 0 1.5px var(--target)}
.plan-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;cursor:pointer}
.plan-h > span:first-child{min-width:0}
.chev{flex:none;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.dpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dpick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}
.dpick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill.soft{background:var(--chip);color:var(--muted)}
.more summary{cursor:pointer;font-weight:600;font-size:15px}
.donebtn{padding:14px;font-size:16px}
.donebox.isdone,.tcard.isdone{border-color:var(--target)}
.btn:disabled{opacity:.45}
.alist .custom{border-style:dashed}
.page .link{padding:4px 0;font-size:15px;cursor:pointer;text-decoration:none}
/* ---- progress tab ---- */
.radar{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;overflow:visible;touch-action:manipulation}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-band{fill:var(--band)}
.rd-ring{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.rd-area{fill:color-mix(in srgb,var(--target) 22%,transparent);stroke:var(--target);stroke-width:2;stroke-linejoin:round}
.rd-pt{fill:var(--target);stroke:var(--surface);stroke-width:2}
.rd-n{fill:var(--muted);font-size:13px;font-weight:600;font-family:var(--f-body)}
.rd-v{fill:var(--ink);font-size:15px;font-weight:700;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.rd-dot{font-size:11px}
.rd-lab.on .rd-n{fill:var(--ink)}
.rd-hit{fill:transparent;cursor:pointer}
.rd-key{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rd-key i{width:14px;height:10px;border-radius:3px;background:var(--band);border:1px dashed var(--muted)}
.rd-sel{display:grid;gap:7px;background:var(--bg);border-radius:12px;padding:11px 12px}
.rd-part{display:grid;grid-template-columns:minmax(0,1fr) 40% 34px;gap:10px;align-items:center;font-size:14px}
.rd-part b{text-align:right;font-variant-numeric:tabular-nums}
.pfig.focus [data-m] .m{opacity:.35}
.pfig.focus [data-m].hl .m{opacity:1;stroke:var(--ink);stroke-width:2.5}
.seg.pview{display:flex}.seg.pview button{flex:1}
.kglegend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.kglegend span,.kgtip span{display:inline-flex;align-items:center;gap:6px}
.kglegend i,.kgtip i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--k1)}
.kglegend i.k2,.kgtip i.k2{border-top:2.5px dashed var(--k2)}
.kg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;cursor:pointer}
.kgdelta{flex:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--chip);border-radius:8px;padding:5px 9px}
.seg.kgr{align-self:start}
.kgchart{position:relative;min-width:0}
.kgsvg{display:block;width:100%;height:auto;touch-action:pan-y}
.kg-grid{stroke:var(--line);stroke-width:1}
.kg-ax{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.kg-l1{fill:none;stroke:var(--k1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.kg-l2{fill:none;stroke:var(--k2);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.kg-d1{fill:var(--k1);stroke:var(--surface);stroke-width:2}
.kg-d2{fill:var(--k2);stroke:var(--surface);stroke-width:2}
.kg-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.kg-hit{fill:transparent;cursor:crosshair}
.kgtip{position:absolute;top:0;width:176px;box-sizing:border-box;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.35;display:grid;gap:2px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.kgtip[hidden]{display:none}
.kgstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kgstats div{background:var(--bg);border-radius:10px;padding:9px 11px;display:grid;gap:1px;min-width:0}
.kgstats span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.kgstats b{font-family:var(--f-display);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.kgstats small{font-size:12px;color:var(--muted)}
.kgtab{display:grid;gap:0;font-size:14px}
.kgrow{display:grid;grid-template-columns:70px minmax(0,1fr) 90px;gap:8px;padding:7px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kgrow span:last-child{text-align:right}
.kghead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);border-top:0}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav .plabel{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-align:center;flex:1;min-width:0}
.pnav .ib:disabled{opacity:.35}
.pfig{display:block;width:100%;height:auto;max-height:min(60vh,520px);touch-action:manipulation}
.pfig .m{fill:var(--m);transition:none}
.pfig .skin{fill:var(--fig-skin)}
.pfig.focus [data-m]:not(.hl) .fib{opacity:.4}
.zwrap{position:relative}
.zwrap .pfig{touch-action:pan-y}
.zwrap.zoomed .pfig{touch-action:none}
.zreset{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;cursor:pointer}
.zreset[hidden]{display:none}
.pfig [data-m]{cursor:pointer}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.bands div{display:grid;gap:2px;align-content:start;min-width:0}
.bands i{display:block;height:10px;border-radius:3px}
.bands div:first-child i{border-radius:6px 3px 3px 6px}.bands div:last-child i{border-radius:3px 6px 6px 3px}
.bands b{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.bands small{font-size:11px;line-height:1.2;color:var(--muted)}
.pg-b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.pg-b i{width:8px;height:8px;border-radius:50%;flex:none}
.warnbox{border:1px solid var(--target);background:color-mix(in srgb,var(--target) 8%,var(--surface));border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.warnbox b{display:block;color:var(--target);margin-bottom:2px}
.pstat{display:flex;gap:10px}
.pstat > div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px}
.pstat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.05}
.pstat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pg{border-top:1px solid var(--line)}
.pg summary{display:grid;grid-template-columns:minmax(0,1fr) 38% 40px;gap:10px;align-items:center;padding:11px 2px;cursor:pointer;list-style:none}
.pg summary::-webkit-details-marker{display:none}
.pg-n{font-weight:600;font-size:15px}
.pg-bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.pg-bar i{display:block;height:100%;border-radius:5px}
.pg summary b{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.pg-parts{display:grid;gap:6px;padding:0 2px 12px 12px}
.pg-parts div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.pg-parts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#tab-atlas .stage{transition:none}}

button.brand{border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;color:inherit;text-align:left;align-items:center;gap:6px}
button.brand:hover{background:var(--chip)}
.rk-sec{margin:6px 0 -4px;display:flex;align-items:center;gap:8px}
.rk-me{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.rk-bw,.rk-sexw{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

.rk-eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.rk-big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.95;letter-spacing:.02em;text-transform:uppercase}
.rk-sub{font-size:14px;line-height:1.4;opacity:.9}.rk-sub.sm{font-size:12px;opacity:.75}
.rk-ladder{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
.rk-ladder span{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.02em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.62);white-space:nowrap}

.rk-legend span{display:flex;align-items:center;gap:5px}.rk-legend i{width:12px;height:12px;border-radius:3px;flex:none}
.rk-low{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}

.pg-n .rk-chip{display:flex;margin-top:3px;font-weight:500;color:var(--muted)}
.rk-chip i{width:10px;height:10px;border-radius:50%;flex:none}
.rk-bar{position:relative;display:block;height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:5px}

.rk-g summary{grid-template-columns:minmax(0,1fr) 38% 44px}
.rk-exs{display:grid;gap:12px;padding:4px 2px 14px}
.rk-ex{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rk-exn{font-weight:600;font-size:14px;min-width:0}.rk-exn small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.rk-next{font-size:12px;color:var(--muted)}
.rk-man{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:var(--target);font-size:12px;font-weight:600;text-decoration:underline}
.rk-form{border-color:var(--ink)}
.rk-inps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rk-inps label{display:grid;gap:4px;font-size:12px;color:var(--muted);align-content:start}

"Semana.":"Week.","Cerca de 4 séries já dão crescimento mensurável. 10 ou mais são necessárias para maximizar. Entre 12 e 20 é a provável faixa ideal para quem já treina. Acima de 20 ainda pode ajudar, mas cada série a mais rende menos e quase não há estudos acima de 25–30.":"About 4 sets already give measurable growth. 10 or more are needed to maximize it. 12 to 20 is the likely ideal range for people who already train. Above 20 can still help, but each extra set gives less, and there are almost no studies above 25–30.",
"Treino do dia.":"The day's workout.","Até cerca de 11 séries por músculo no mesmo treino ainda trazem ganho mensurável. Depois disso, os estudos não mostram ganho extra.":"Up to about 11 sets per muscle in the same workout still bring measurable gains. Beyond that, studies show no extra gain.",
"Repetições e esforço.":"Reps and effort.","De cerca de 6 a 30 repetições o crescimento é parecido, se a série terminar perto da falha (sobrando 0 a 2 repetições). Séries muito leves ou longe da falha estimulam menos, mas o app conta todas as séries marcadas.":"From about 6 to 30 reps growth is similar, as long as the set ends close to failure (0 to 2 reps left). Very light sets or sets far from failure stimulate less, but the app counts every set marked.",

"Maior carga do dia":"Day's heaviest load","novo":"new",
"Força estimada = carga × (1 + repetições ÷ 30). É uma estimativa da carga máxima para 1 repetição, útil para comparar treinos com repetições diferentes; fica menos precisa acima de ~12 repetições.":"Estimated strength = load × (1 + reps ÷ 30). It estimates your max load for 1 rep, useful for comparing workouts with different reps; it gets less accurate above ~12 reps.",
"De onde vêm os números.":"Where the numbers come from.",
"As faixas misturam duas bases de pessoas que treinam: o Strength Level (cerca de 11 milhões de registros digitados) e o StrengthLog (cerca de 24 mil usuários de um app de treino). Nos exercícios que as duas têm (supino, agachamento, terra e desenvolvimento), o app usa a média das duas. Nos outros, usa o Strength Level corrigido pela diferença média entre elas. No iniciante as duas concordam; no topo o Strength Level é 15–40% mais difícil (o elite dele fica perto do top 10% de atletas de powerlifting com antidoping), então a mistura fica mais realista para quem treina em academia. As faixas são percentis entre pessoas do mesmo sexo: iniciante 5%, novato ~20%, intermediário 50%, avançado ~80% e elite 95%. O app usa o corpo ♂/♀ escolhido.":"The bands mix two databases of people who train: Strength Level (about 11 million entered records) and StrengthLog (about 24 thousand users of a training app). For the exercises both have (bench press, squat, deadlift and overhead press), the app uses the average of the two. For the others, it uses Strength Level corrected by the average gap between them. At beginner the two agree; at the top Strength Level is 15–40% harder (its elite is close to the top 10% of drug-tested powerlifters), so the mix is more realistic for people who train at a gym. The bands are percentiles among people of the same sex: beginner 5%, novice ~20%, intermediate 50%, advanced ~80% and elite 95%. The app uses the ♂/♀ body you chose.",
"Os 9 níveis":"The 9 levels",
"(quanto % de quem treina você supera): Ameba = menos de 5% · Aprendiz = 5–15% · Frango = 15–30% · Galo = 30–45% · Fortinho = 45–60% · Parrudo = 60–75% · Monstro = 75–88% · Lenda = 88–96% · Bizarro = top 4%. Os níveis do meio têm a mesma largura; as pontas são mais difíceis. Entre as faixas do site, o app interpola.":"(what % of people who train you beat): Amoeba = under 5% · Rookie = 5–15% · Chicken = 15–30% · Rooster = 30–45% · Buff = 45–60% · Beefy = 60–75% · Monster = 75–88% · Legend = 88–96% · Freak = top 4%. The middle levels are the same width; the ends are harder. Between the site's bands, the app interpolates.",
"Peso corporal.":"Bodyweight.",
"As faixas publicadas são para o praticante típico (cerca de 77 kg no masculino e 65 kg no feminino). Para outros pesos, o app segue as tabelas das duas bases: nos homens, a força cresce quase na mesma proporção do peso; nas mulheres, bem menos. Ex.: um homem 10% mais pesado precisa levantar cerca de 9% a mais para o mesmo nível; uma mulher 10% mais pesada, cerca de 6% a mais.":"The published bands are for the typical lifter (about 77 kg for men and 65 kg for women). For other weights, the app follows both databases' tables: in men, strength grows almost in proportion to weight; in women, much less. E.g. a man 10% heavier needs to lift about 9% more for the same level; a woman 10% heavier, about 6% more.",
"Idade.":"Age.","Se você puser sua idade em Configurações, a partir dos 40 anos as faixas descem para comparar você com gente da sua idade: cerca de 95% aos 45, 89% aos 50, 82% aos 55, 75% aos 60, 67% aos 65 e 61% aos 70. Antes dos 40, nada muda.":"If you enter your age in Settings, from age 40 the bands come down to compare you with people your age: about 95% at 45, 89% at 50, 82% at 55, 75% at 60, 67% at 65 and 61% at 70. Before 40, nothing changes.",
"Sua força em cada exercício.":"Your strength in each exercise.",
"Para cada série, o app calcula a força estimada (carga × (1 + repetições ÷ 30), fórmula de Epley) e guarda a melhor dos últimos 6 meses, dos treinos marcados como feitos ou digitada aqui. Acima de 12 repetições a estimativa erra mais, então cada repetição a mais vale metade (ex.: 20 repetições contam como 1,53 × a carga, em vez de 1,67). Exercícios com o peso do corpo contam o corpo: barra fixa e mergulho (o corpo todo), flexão (cerca de 69% do peso no chão, 74% com os pés elevados, 45% com as mãos elevadas, comparada com o supino) e remada invertida (cerca de 55%, comparada com a remada curvada). Peso extra (colete, anilha) soma; na barra assistida (graviton), a ajuda é descontada. Nesses exercícios valem até 30 repetições na conta.":"For each set, the app calculates the estimated strength (load × (1 + reps ÷ 30), the Epley formula) and keeps the best of the last 6 months, from workouts marked as done or entered here. Past 12 reps the estimate drifts, so each extra rep counts half (e.g. 20 reps count as 1.53 × the load instead of 1.67). Bodyweight exercises count your body: pull-ups and dips (the whole body), push-ups (about 69% of your weight on the floor, 74% with feet elevated, 45% with hands elevated, compared with the bench press) and inverted rows (about 55%, compared with the bent-over row). Extra weight (vest, plate) adds on; on the assisted machine, the assistance is subtracted. Up to 30 reps count for these exercises.",
"Nível do grupo.":"Group level.","É a média de":"It's the average of","todos":"all",
"os exercícios do grupo que você fez, não só um. Um exercício conta para cada grupo que ele tem como alvo (ex.: agachamento conta para quadríceps e glúteos). O nível geral é a média dos grupos. Grupo com um exercício só aparece com \"pouca informação\": o nível vale, mas é menos confiável.":"the group's exercises you did, not just one. An exercise counts for every group it targets (e.g. squats count for quads and glutes). The overall level is the average of the groups. A group with a single exercise says \"little data\": the level counts, but it's less reliable.",
"Aproximações.":"Approximations.",
"Halteres: o peso é de cada halter. Variações sem padrão próprio usam o mais próximo com um fator (ex.: supino inclinado com halteres ≈ 90% do reto; máquina com um braço só ≈ metade do peso dos dois). Prancha, abdominais e afundo ou ponte só com o corpo ficam fora, porque não há um padrão de carga justo para eles. Máquinas variam de marca para marca, então use o nível delas como referência, não como verdade absoluta.":"Dumbbells: the weight is per dumbbell. Variations without their own standard use the closest one with a factor (e.g. incline dumbbell press ≈ 90% of flat; a one-arm machine ≈ half the weight of two arms). Planks, crunches, and bodyweight-only lunges or bridges are left out because there's no fair load standard for them. Machines vary by brand, so treat their level as a reference, not absolute truth.",

nergistas.", "Semana": "Semana", ": 4–9 séries é estímulo moderado, 10–20 é a faixa ideal, mais de 20 é volume alto.": ": 4–9 series es estímulo moderado, 10–20 es el rango ideal, más de 20 es volumen alto.", "Dia": "Día", ": até ~11 séries por músculo no mesmo treino ainda trazem ganho; depois disso, quase nada a mais.": ": hasta ~11 series por músculo en el mismo entrenamiento todavía dan ganancia; después de eso, casi nada más.", "Mire 10–20 séries por semana em cada grupo que quer crescer, divididas em 2 ou mais treinos.": "Apunta a 10–20 series por semana en cada grupo que quieras hacer crecer, repartidas en 2 o más entrenamientos.", "Grupos em \"Não treinados\" mostram o que ficou de fora na semana.": "Los grupos en \"No entrenado\" muestran lo que quedó fuera en la semana.", "Ajustes do app. Tudo fica salvo só neste aparelho e vai junto no backup.": "Ajustes de la app. Todo se guarda solo en este dispositivo y va incluido en la copia de seguridad.", "O que já funciona": "Lo que ya funciona", "Perfil": "Perfil", ": nome (aparece na aba Hoje), peso e corpo ♂/♀ (usados no ranking de força).": ": nombre (aparece en la pestaña Hoy), peso y cuerpo ♂/♀ (usados en la clasificación de fuerza).", "Aparência": "Apariencia", ": tema claro/escuro/automático, cor de destaque, tamanho da letra e reduzir animações.": ": tema claro/oscuro/automático, color de acento, tamaño de letra y reducir animaciones.", "Treino": "Entrenamiento", ": séries e repetições que já vêm ao adicionar um exercício.": ": series y repeticiones que vienen al agregar un ejercicio.", "Meta semanal": "Meta semanal", ": aparece na grade da aba Hoje (\"2 de 4 treinos\").": ": aparece en la cuadrícula de la pestaña Hoy (\"2 de 4 entrenamientos\").", "Seus dados": "Tus datos", ": exportar e importar backup, apagar histórico, cargas digitadas ou tudo.": ": exportar e importar copia de seguridad, borrar historial, cargas escritas o todo.", "Sobre": "Acerca de", ": compartilhar o app, mandar sugestões e ver as fontes.": ": compartir la app, enviar sugerencias y ver las fuentes.", "Em breve": "Próximamente", "Libras, lembretes e conta com sincronização. As escolhas já ficam guardadas.": "Libras, recordatorios y cuenta con sincronización. Las elecciones ya quedan guardadas.", "Ranking de força": "Clasificación de fuerza", "Mostra quão forte você é em cada grupo muscular, em 9 níveis:": "Muestra qué tan fuerte eres en cada grupo muscular, en 9 niveles:", "Ameba, Aprendiz, Frango, Galo, Fortinho, Parrudo, Monstro, Lenda e Bizarro": "Ameba, Aprendiz, Pollito, Gallo, Fuertecito, Macizo, Monstruo, Leyenda y Fenómeno", ". A comparação mistura duas bases de pessoas que treinam (Strength Level e StrengthLog), do mesmo sexo, ajustada ao seu peso e, a partir dos 40 anos, à sua idade.": ". La comparación mezcla dos bases de personas que entrenan (Strength Level y StrengthLog), del mismo sexo, ajustada a tu peso y, a partir de los 40 años, a tu edad.", "Seu peso": "Tu peso", "corpo ♂/♀": "cuerpo ♂/♀", ": mudam as faixas. Coloque seu peso para o resultado ficar certo.": ": cambian las franjas. Pon tu peso para que el resultado sea correcto.", "para ver cada exercício que entrou na conta, o nível dele e quanto falta para o próximo nível.": "para ver cada ejercicio que entró en la cuenta, su nivel y cuánto falta para el siguiente nivel.", "+ Digitar uma carga": "+ Escribir una carga", ": para exercícios que você faz mas ainda não anotou nos treinos. Escolha o exercício e a variação, coloque a carga e as repetições.": ": para ejercicios que haces pero todavía no anotaste en los entrenamientos. Elige el ejercicio y la variación, pon la carga y las repeticiones.", "Toque no boneco para ver o nível de cada parte.": "Toca el muñeco para ver el nivel de cada parte.", "As cargas vêm dos treinos marcados como feitos (com carga e repetições anotadas) nos últimos 6 meses e do que você digitar aqui. Vale a melhor série de cada exercício.": "Las cargas vienen de los entrenamientos marcados como hechos (con carga y repeticiones anotadas) en los últimos 6 meses y de lo que escribas aquí. Vale la mejor serie de cada ejercicio.", "Cada série vira força estimada (carga × (1 + reps ÷ 30); acima de 12 reps, cada uma vale metade) e é comparada com as faixas daquele exercício.": "Cada serie se convierte en fuerza estimada (carga × (1 + reps ÷ 30); por encima de 12 reps, cada una vale la mitad) y se compara con las franjas de ese ejercicio.", "O nível do grupo é a média de todos os exercícios dele; o nível geral é a média dos grupos. Com um exercício só, aparece \"pouca informação\".": "El nivel del grupo es el promedio de todos sus ejercicios; el nivel general es el promedio de los grupos. Con un solo ejercicio aparece \"poca información\".", "Idade (em Configurações): a partir dos 40, as faixas se ajustam à sua idade.": "Edad (en Ajustes): a partir de los 40, las franjas se ajustan a tu edad.", "pouca informação": "poca información", "Só 1 exercício: o nível é pouco confiável. Registre outro exercício deste grupo para ficar mais certo.": "Solo 1 ejercicio: el nivel es poco confiable. Registra otro ejercicio de este grupo para que sea más preciso.", "Ajusta o ranking de força a partir dos 40.": "Ajusta la clasificación de fuerza a partir de los 40.", "Halteres: use o peso de cada halter.": "Mancuernas: usa el peso de cada mancuerna.", "Barra fixa, mergulho, flexão e remada invertida contam o seu peso corporal. Se fizer só com o corpo, deixe a carga em branco (ou 0) e anote as repetições.": "Dominadas, fondos, flexiones y remo invertido cuentan tu peso corporal. Si lo haces solo con el cuerpo, deja la carga en blanco (o 0) y anota las repeticiones.", "Fortinho fica em volta da média de quem treina (45–60%). Monstro já é mais forte que 3 em cada 4 pessoas.": "Fuertecito está alrededor del promedio de quienes entrenan (45–60%). Monstruo ya es más fuerte que 3 de cada 4 personas.", "Séries de 3 a 12 repetições dão a estimativa mais confiável.": "Las series de 3 a 12 repeticiones dan la estimación más confiable.", "O ranking fica em Progresso › Força, em cima da evolução das cargas.": "La clasificación está en Progreso › Fuerza, encima de la evolución de las cargas.", "Adicionar exercício": "Agregar ejercicio", "Treino sem nome": "Entrenamiento sin nombre", "+ Novo treino com este exercício": "+ Nuevo entrenamiento con este ejercicio", "Treino de hoje": "Entrenamiento de hoy", "Em andamento": "En curso", "Buscar exercício": "Buscar ejercicio", "Buscar ou digitar um exercício": "Buscar o escribir un ejercicio", "Grupo muscular": "Grupo muscular", "Adicionar": "Agregar", "Exercício próprio, fora da lista": "Ejercicio propio, fuera de la lista", "Monte seus treinos aqui. Para registrar um treino, vá na aba Hoje e toque em Marcar como feito.": "Arma tus entrenamientos aquí. Para registrar un entrenamiento, ve a la pestaña Hoy y toca Marcar como hecho.", "Dias da semana (opcional)": "Días de la semana (opcional)", "Nos dias marcados, este treino aparece primeiro na aba Hoje.": "En los días marcados, este entrenamiento aparece primero en la pestaña Hoy.", "Séries": "Series", "Reps": "Reps", "+ Adicionar exercício": "+ Agregar ejercicio", "Nome do treino": "Nombre del entrenamiento", "Nome, ex.: Peito e tríceps": "Nombre, ej.: Pecho y tríceps", "Subir": "Subir", "Descer": "Bajar", "Excluir este treino? O que você já fez continua no histórico.": "¿Eliminar este entrenamiento? Lo que ya hiciste sigue en el historial.", "Excluir": "Eliminar", "Cancelar": "Cancelar", "Nenhum exercício ainda.": "Todavía no hay ejercicios.", "Esqueceu de registrar? Toque num dia que já passou.": "¿Olvidaste registrarlo? Toca un día que ya pasó.", "Seus treinos": "Tus entrenamientos", "Não feito": "No hecho", "Continuar anotando": "Seguir anotando", "Sem exercícios. Monte na aba Treinos.": "Sin ejercicios. Ármalo en la pestaña Entrenos.", "Treino personalizado de hoje": "Entrenamiento personalizado de hoy", "Continuar": "Continuar", "+ Montar um treino só para hoje": "+ Armar un entrenamiento solo para hoy", "Backup, apagar dados e outros ajustes ficam em Configurações (engrenagem lá em cima).": "La copia de seguridad, borrar datos y otros ajustes están en Ajustes (el engranaje de arriba).", "Semana anterior": "Semana anterior", "Próxima semana": "Semana siguiente", "‹ Hoje": "‹ Hoy", "Carga (kg)": "Carga (kg)", "+ Série": "+ Serie", "Anotações do treino": "Notas del entrenamiento", "Excluir do histórico": "Eliminar del historial", "kg": "kg", "Anotações deste exercício": "Notas de este ejercicio", "Como foi o treino, energia, sono, dores…": "Cómo fue el entrenamiento, energía, sueño, dolores…", "Excluir este treino do histórico?": "¿Eliminar este entrenamiento del historial?", "Voltar para hoje": "Volver a hoy", "Feito ✓": "Hecho ✓", "Ver séries": "Ver series", "+ Montar um treino só para este dia": "+ Armar un entrenamiento solo para este día", "‹ Voltar": "‹ Volver", "Vira um treino fixo na aba Treinos.": "Se convierte en un entrenamiento fijo en la pestaña Entrenos.", "Nenhum exercício ainda. Adicione abaixo ou pelo + nos cartões do Atlas.": "Todavía no hay ejercicios. Agrégalos abajo o con el + de las tarjetas del Atlas.", "Semana passada": "Semana pasada", "Músculos que você treinou, pelos treinos marcados como feitos na aba Hoje. Cada série conta 1 para o músculo alvo e ½ para os sinergistas.": "Músculos que entrenaste, según los entrenamientos marcados como hechos en la pestaña Hoy. Cada serie cuenta 1 para el músculo objetivo y ½ para los sinergistas.", "Músculos": "Músculos", "Esta semana": "Esta semana", "Não treinado": "No entrenado", "Abaixo do mínimo": "Por debajo del mínimo", "Estímulo moderado": "Estímulo moderado", "Faixa ideal": "Rango ideal", "Volume alto": "Volumen alto", "Séries feitas": "Series hechas", "Grupos treinados": "Grupos entrenados", "faixa ideal (10–20)": "rango ideal (10–20)", "Core": "Core", "Toque num grupo para ver as partes e destacar os músculos no boneco.": "Toca un grupo para ver las partes y resaltar los músculos en el muñeco.", "Cada ponta mostra a média de séries por músculo do grupo (ex.: Pernas = média de quadríceps, posterior, glúteos, adutores e panturrilha).": "Cada punta muestra el promedio de series por músculo del grupo (ej.: Piernas = promedio de cuádriceps, isquiotibiales, glúteos, aductores y pantorrilla).", "Séries por músculo na semana": "Series por músculo en la semana", "Séries por músculo no treino": "Series por músculo en el entrenamiento", "Como as faixas foram definidas": "Cómo se definieron las franjas", "As séries contam como nos estudos: série do músculo alvo vale 1, de sinergista vale ½. As faixas valem para o músculo inteiro (o número de cada grupo na lista). No boneco, cada parte é pintada pelo próprio número.": "Las series cuentan como en los estudios: la serie del músculo objetivo vale 1, la de sinergista vale ½. Las franjas valen para el músculo entero (el número de cada grupo en la lista). En el muñeco, cada parte se pinta por su propio número.", "Semana.": "Semana.", "Cerca de 4 séries já dão crescimento mensurável. 10 ou mais são necessárias para maximizar. Entre 12 e 20 é a provável faixa ideal para quem já treina. Acima de 20 ainda pode ajudar, mas cada série a mais rende menos e quase não há estudos acima de 25–30.": "Unas 4 series ya dan crecimiento medible. 10 o más son necesarias para maximizar. Entre 12 y 20 es el rango ideal probable para quien ya entrena. Más de 20 todavía puede ayudar, pero cada serie extra rinde menos y casi no hay estudios por encima de 25–30.", "Treino do dia.": "Entrenamiento del día.", "Até cerca de 11 séries por músculo no mesmo treino ainda trazem ganho mensurável. Depois disso, os estudos não mostram ganho extra.": "Hasta unas 11 series por músculo en el mismo entrenamiento todavía dan ganancia medible. Después de eso, los estudios no muestran ganancia extra.", "Repetições e esforço.": "Repeticiones y esfuerzo.", "De cerca de 6 a 30 repetições o crescimento é parecido, se a série terminar perto da falha (sobrando 0 a 2 repetições). Séries muito leves ou longe da falha estimulam menos, mas o app conta todas as séries marcadas.": "De unas 6 a 30 repeticiones el crecimiento es parecido, si la serie termina cerca del fallo (sobrando 0 a 2 repeticiones). Las series muy ligeras o lejos del fallo estimulan menos, pero la app cuenta todas las series marcadas.", "Pelland et al. (2024/2026, Sports Medicine): volume semanal e frequência, 67 estudos": "Pelland et al. (2024/2026, Sports Medicine): volumen semanal y frecuencia, 67 estudios", "Remmert et al. (2025, pré-publicação): volume por treino, 35 estudos": "Remmert et al. (2025, prepublicación): volumen por entrenamiento, 35 estudios", "Schoenfeld, Ogborn e Krieger (2017): 10+ séries por semana": "Schoenfeld, Ogborn y Krieger (2017): 10+ series por semana", "Baz-Valle et al. (2022, J. Human Kinetics): 12–20 séries por semana em treinados": "Baz-Valle et al. (2022, J. Human Kinetics): 12–20 series por semana en entrenados", "Schoenfeld et al. (2017, JSCR): carga leve vs pesada até a falha": "Schoenfeld et al. (2017, JSCR): carga ligera vs pesada hasta el fallo", "Robinson et al. (2024, Sports Medicine) e Refalo et al. (2024, J. Sports Sciences): proximidade da falha": "Robinson et al. (2024, Sports Medicine) y Refalo et al. (2024, J. Sports Sciences): proximidad al fallo", "Spiering et al. (2021, JSCR): dose mínima para manter": "Spiering et al. (2021, JSCR): dosis mínima para mantener", "Tipo de progresso": "Tipo de progreso", "Período": "Período", "Músculos treinados no período, frente e costas": "Músculos entrenados en el período, frente y espalda", "Faixas de séries": "Franjas de series", "Ontem": "Ayer", "Leve": "Ligero", "Bom": "Bueno", "Forte": "Fuerte", "Pouco ganho extra": "Poca ganancia extra", "bom a forte (3–11)": "bueno a fuerte (3–11)", "Dia anterior": "Día anterior", "Próximo dia": "Día siguiente", "Nenhum treino feito nesta semana. Na aba Hoje, abra o treino e toque em Marcar como feito.": "Ningún entrenamiento hecho esta semana. En la pestaña Hoy, abre el entrenamiento y toca Marcar como hecho.", "Nenhum treino feito neste dia. Na aba Hoje, abra o treino e toque em Marcar como feito.": "Ningún entrenamiento hecho este día. En la pestaña Hoy, abre el entrenamiento y toca Marcar como hecho.", "Ir para Hoje": "Ir a Hoy", "Seu nível de força comparado com quem treina e a evolução das cargas que você anotou nos treinos marcados como feitos.": "Tu nivel de fuerza comparado con quienes entrenan y la evolución de las cargas que anotaste en los entrenamientos marcados como hechos.", "Evolução das cargas que você anotou nos treinos marcados como feitos.": "Evolución de las cargas que anotaste en los entrenamientos marcados como hechos.", "Nível geral": "Nivel general", "Sem dados": "Sin datos", "Nível por grupo": "Nivel por grupo", "mais forte que": "más fuerte que", "apagar": "borrar", "Evolução por exercício": "Evolución por ejercicio", "Maior carga do dia": "Carga más alta del día", "novo": "nuevo", "Força estimada = carga × (1 + repetições ÷ 30). É uma estimativa da carga máxima para 1 repetição, útil para comparar treinos com repetições diferentes; fica menos precisa acima de ~12 repetições.": "Fuerza estimada = carga × (1 + repeticiones ÷ 30). Es una estimación de la carga máxima para 1 repetición, útil para comparar entrenamientos con repeticiones diferentes; es menos precisa por encima de ~12 repeticiones.", "De onde vêm os números.": "De dónde vienen los números.", "As faixas misturam duas bases de pessoas que treinam: o Strength Level (cerca de 11 milhões de registros digitados) e o StrengthLog (cerca de 24 mil usuários de um app de treino). Nos exercícios que as duas têm (supino, agachamento, terra e desenvolvimento), o app usa a média das duas. Nos outros, usa o Strength Level corrigido pela diferença média entre elas. No iniciante as duas concordam; no topo o Strength Level é 15–40% mais difícil (o elite dele fica perto do top 10% de atletas de powerlifting com antidoping), então a mistura fica mais realista para quem treina em academia. As faixas são percentis entre pessoas do mesmo sexo: iniciante 5%, novato ~20%, intermediário 50%, avançado ~80% e elite 95%. O app usa o corpo ♂/♀ escolhido.": "Las franjas mezclan dos bases de personas que entrenan: Strength Level (unos 11 millones de registros escritos) y StrengthLog (unos 24 mil usuarios de una app de entrenamiento). En los ejercicios que tienen las dos (press de banca, sentadilla, peso muerto y press de hombros), la app usa el promedio de ambas. En los demás, usa Strength Level corregido por la diferencia media entre ellas. En principiante las dos coinciden; arriba Strength Level es 15–40% más difícil (su élite queda cerca del top 10% de atletas de powerlifting con control antidopaje), así que la mezcla es más realista para quien entrena en el gimnasio. Las franjas son percentiles entre personas del mismo sexo: principiante 5%, novato ~20%, intermedio 50%, avanzado ~80% y élite 95%. La app usa el cuerpo ♂/♀ elegido.", "Os 9 níveis": "Los 9 niveles", "(quanto % de quem treina você supera): Ameba = menos de 5% · Aprendiz = 5–15% · Frango = 15–30% · Galo = 30–45% · Fortinho = 45–60% · Parrudo = 60–75% · Monstro = 75–88% · Lenda = 88–96% · Bizarro = top 4%. Os níveis do meio têm a mesma largura; as pontas são mais difíceis. Entre as faixas do site, o app interpola.": "(qué % de quienes entrenan superas): Ameba = menos del 5% · Aprendiz = 5–15% · Pollito = 15–30% · Gallo = 30–45% · Fuertecito = 45–60% · Macizo = 60–75% · Monstruo = 75–88% · Leyenda = 88–96% · Fenómeno = top 4%. Los niveles del medio tienen el mismo ancho; las puntas son más difíciles. Entre las franjas del sitio, la app interpola.", "Peso corporal.": "Peso corporal.", "As faixas publicadas são para o praticante típico (cerca de 77 kg no masculino e 65 kg no feminino). Para outros pesos, o app segue as tabelas das duas bases: nos homens, a força cresce quase na mesma proporção do peso; nas mulheres, bem menos. Ex.: um homem 10% mais pesado precisa levantar cerca de 9% a mais para o mesmo nível; uma mulher 10% mais pesada, cerca de 6% a mais.": "Las franjas publicadas son para el practicante típico (unos 77 kg en hombres y 65 kg en mujeres). Para otros pesos, la app sigue las tablas de las dos bases: en hombres, la fuerza crece casi en la misma proporción que el peso; en mujeres, bastante menos. Ej.: un hombre 10% más pesado necesita levantar cerca de un 9% más para el mismo nivel; una mujer 10% más pesada, cerca de un 6% más.", "Idade.": "Edad.", "Se você puser sua idade em Configurações, a partir dos 40 anos as faixas descem para comparar você com gente da sua idade: cerca de 95% aos 45, 89% aos 50, 82% aos 55, 75% aos 60, 67% aos 65 e 61% aos 70. Antes dos 40, nada muda.": "Si pones tu edad en Ajustes, a partir de los 40 años las franjas bajan para compararte con gente de tu edad: cerca del 95% a los 45, 89% a los 50, 82% a los 55, 75% a los 60, 67% a los 65 y 61% a los 70. Antes de los 40, no cambia nada.", "Sua força em cada exercício.": "Tu fuerza en cada ejercicio.", "Para cada série, o app calcula a força estimada (carga × (1 + repetições ÷ 30), fórmula de Epley) e guarda a melhor dos últimos 6 meses, dos treinos marcados como feitos ou digitada aqui. Acima de 12 repetições a estimativa erra mais, então cada repetição a mais vale metade (ex.: 20 repetições contam como 1,53 × a carga, em vez de 1,67). Exercícios com o peso do corpo contam o corpo: barra fixa e mergulho (o corpo todo), flexão (cerca de 69% do peso no chão, 74% com os pés elevados, 45% com as mãos elevadas, comparada com o supino) e remada invertida (cerca de 55%, comparada com a remada curvada). Peso extra (colete, anilha) soma; na barra assistida (graviton), a ajuda é descontada. Nesses exercícios valem até 30 repetições na conta.": "Para cada serie, la app calcula la fuerza estimada (carga × (1 + repeticiones ÷ 30), fórmula de Epley) y guarda la mejor de los últimos 6 meses, de los entrenamientos marcados como hechos o escrita aquí. Por encima de 12 repeticiones la estimación se equivoca más, así que cada repetición extra vale la mitad (ej.: 20 repeticiones cuentan como 1,53 × la carga, en vez de 1,67). Los ejercicios con peso corporal cuentan el cuerpo: dominadas y fondos (el cuerpo entero), flexiones (cerca del 69% del peso en el suelo, 74% con los pies elevados, 45% con las manos elevadas, comparadas con el press de banca) y remo invertido (cerca del 55%, comparado con el remo inclinado). El peso extra (chaleco, disco) suma; en la dominada asistida, la ayuda se descuenta. En estos ejercicios valen hasta 30 repeticiones en la cuenta.", "Nível do grupo.": "Nivel del grupo.", "É a média de": "Es el promedio de", "todos": "todos", "os exercícios do grupo que você fez, não só um. Um exercício conta para cada grupo que ele tem como alvo (ex.: agachamento conta para quadríceps e glúteos). O nível geral é a média dos grupos. Grupo com um exercício só aparece com \"pouca informação\": o nível vale, mas é menos confiável.": "los ejercicios del grupo que hiciste, no solo uno. Un ejercicio cuenta para cada grupo que tiene como objetivo (ej.: la sentadilla cuenta para cuádriceps y glúteos). El nivel general es el promedio de los grupos. Un grupo con un solo ejercicio aparece con \"poca información\": el nivel vale, pero es menos confiable.", "Aproximações.": "Aproximaciones.", "Halteres: o peso é de cada halter. Variações sem padrão próprio usam o mais próximo com um fator (ex.: supino inclinado com halteres ≈ 90% do reto; máquina com um braço só ≈ metade do peso dos dois). Prancha, abdominais e afundo ou ponte só com o corpo ficam fora, porque não há um padrão de carga justo para eles. Máquinas variam de marca para marca, então use o nível delas como referência, não como verdade absoluta.": "Mancuernas: el peso es de cada mancuerna. Las variaciones sin estándar propio usan el más cercano con un factor (ej.: press inclinado con mancuernas ≈ 90% del plano; máquina con un solo brazo ≈ la mitad del peso de los dos). Plancha, abdominales y zancada o puente solo con el cuerpo quedan fuera, porque no hay un estándar de carga justo para ellos. Las máquinas varían de marca a marca, así que usa su nivel como referencia, no como verdad absoluta.", "Strength Level: padrões de força por exercício, sexo e peso corporal (strengthlevel.com)": "Strength Level: estándares de fuerza por ejercicio, sexo y peso corporal (strengthlevel.com)", "StrengthLog: padrões de força em kg para agachamento, terra, supino e desenvolvimento (strengthlog.com)": "StrengthLog: estándares de fuerza en kg para sentadilla, peso muerto, press de banca y press de hombros (strengthlog.com)", "van den Hoek e colegas (2024, Journal of Science and Medicine in Sport): percentis de força em 810 mil participações de powerlifting com antidoping": "van den Hoek y colegas (2024, Journal of Science and Medicine in Sport): percentiles de fuerza en 810 mil participaciones de powerlifting con control antidopaje", "Fatores de idade do Strength Level e de estudos de powerlifting master": "Factores de edad de Strength Level y de estudios de powerlifting máster", "Epley (1985): fórmula da força estimada": "Epley (1985): fórmula de la fuerza estimada", "Como funciona o ranking": "Cómo funciona la clasificación", "Boneco colorido pelo nível de força de cada grupo, frente e costas": "Muñeco coloreado según el nivel de fuerza de cada grupo, frente y espalda", "Cores dos níveis": "Colores de los niveles", "O que é força estimada": "Qué es la fuerza estimada", "1 mês": "1 mes", "3 meses": "3 meses", "Tudo": "Todo", "Registre mais treinos com carga para ver a linha.": "Registra más entrenamientos con carga para ver la línea.", "Nenhum registro neste período. Escolha \"Tudo\".": "Ningún registro en este período. Elige \"Todo\".", "Recorde": "Récord", "Última": "Última", "Desde o início": "Desde el inicio", "1 treino só": "Solo 1 entrenamiento", "Data": "Fecha", "Maior c function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){

const ptrs=new Map();let gesture=null;
svg.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch")return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){gesture={type:"tap",sx:e.clientX,sy:e.clientY,target:e.target.closest("[data-j],[data-m]"),vb0:[...vb],t:Date.now()}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gesture={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y),vb0:[...vb],mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gesture)return;
  if(document.getElementById("tab-atlas").classList.contains("covered"))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const scale=vb[2]/svg.getBoundingClientRect().width*Math.max(1,(svg.getBoundingClientRect().width/svg.getBoundingClientRect().height)/(vb[2]/vb[3]));
  if(gesture.type!=="pinch"&&ptrs.size===1){
    const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;
    if(gesture.type==="tap"&&Math.hypot(dx,dy)>8)gesture.type="pan";
    if(gesture.type==="pan"){
      const k=svgUnitsPerPx(gesture.vb0);
      vb=[gesture.vb0[0]-dx*k,gesture.vb0[1]-dy*k,vb[2],vb[3]];clampVB();applyVB();
    }
  }else if(gesture.type==="pinch"&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);

function svgUnitsPerPx(box){const r=svg.getBoundingClientRect();return Math.max(box[2]/r.width,box[3]/r.height)}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;

  }

  else if(ptrs.size===1&&gesture&&gesture.type==="pinch"){const p=[...ptrs.values()][0];gesture={type:"pan",sx:p.x,sy:p.y,vb0:[...vb]}}

let tg=null;

  if(P.length===1)tg={type:"tap",sx:P[0].x,sy:P[0].y,target:e.target.closest("[data-j],[data-m]"),vb0:[...vb]};
  else if(P.length===2){e.preventDefault();const [a,b]=P;tg={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,vb0:[...vb],mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}},{passive:false});

  if(tg.type!=="pinch"&&P.length===1){const dx=P[0].x-tg.sx,dy=P[0].y-tg.sy;if(tg.type==="tap"&&Math.hypot(dx,dy)>8)tg.type="pan";
    if(tg.type==="pan"){const k=svgUnitsPerPx(tg.vb0);vb=[tg.vb0[0]-dx*k,tg.vb0[1]-dy*k,vb[2],vb[3]];clampVB();applyVB()}}
  else if(tg.type==="pinch"&&P.length===2){const [a,b]=P;vb=[...tg.vb0];applyVB();zoomAt(Math.hypot(a.x-b.x,a.y-b.y)/tg.d0,tg.mid.x,tg.mid.y)}},{passive:false});

  else if(P.length===1&&tg.type==="pinch")tg={type:"pan",sx:P[0].x,sy:P[0].y,vb0:[...vb]}},{passive:false});

function basicList(g){

  for(let r=0;r<max;r++)lists.forEach(l=>{const x=l[r];const k=x&&splitKey(x.f,x.pre);if(x&&!seen.has(k)){seen.add(k);out.push(x)}});
