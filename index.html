<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Muscular</title>
<meta name="description" content="Boneco anatômico clicável com exercícios ordenados por estudos de EMG.">
<meta name="theme-color" content="#0E1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Muscular">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: figure stage on the left (top on phones), ranked exercise panel on the right (below on phones). */
:root{
  --bg:#E9ECEF; --surface:#F7F8F9; --ink:#1A1F26; --muted:#5B6470; --line:#CDD2D8;
  --skin:#D6DADF; --m:#AEB6C0; --m-hi:#C3CAD2; --m-lo:#97A0AB; --m-edge:#E9ECEF; --fiber:rgba(26,31,38,.13);
  --target:#D3222A; --target-hi:#F04A50; --target-lo:#A0141B;
  --syn:#F08A24; --syn-soft:rgba(240,138,36,.55);
  --chip:#E1E5E9; --focus:#1A1F26;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; color-scheme:dark}

html{height:100%}body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--target);font-weight:700}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:1;max-width:380px;min-width:0}
.search input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .r-n{font-weight:600;font-size:14px}
.results .r-s{font-size:12px;color:var(--muted)}
.results .empty{padding:12px 14px;color:var(--muted);font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.zoom{display:inline-flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:32px;font-weight:600}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .lt{background:var(--target)} .legend .ls{background:var(--syn)}
.canvas{flex:1;min-height:0;position:relative}
#fig{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}

/* figure */
.skin{fill:var(--skin)}
.m{fill:url(#gM);stroke:var(--m-edge);stroke-width:1.6;stroke-linejoin:round;transition:fill .18s}
.fib{pointer-events:none}
@media (hover:hover){[data-m]:hover .m{fill:var(--m-hi)}}
[data-m].on .m{fill:url(#gT)}
[data-m].syn .m{fill:url(#gS)}
.vlabel{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.2em;fill:var(--muted)}
.detail{fill:none;stroke:var(--m-edge);stroke-width:1.4;pointer-events:none}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-top > div{min-width:0;flex:1}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--target)}
.p-title{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.02;text-wrap:balance}
.p-latin{margin:4px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.clear{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.p-body{flex:1;overflow:auto;padding:14px 18px 24px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.status{font-size:13px;color:var(--muted);line-height:1.4}
.status b{color:var(--syn)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ex:hover{border-color:var(--muted)}
.ex.sel{border-color:var(--syn);box-shadow:inset 0 0 0 1px var(--syn)}
.rank{grid-row:span 3;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}
.ex:first-child .rank{color:var(--target)}
.ex-n{font-weight:600;font-size:15px;line-height:1.25}
.ex-en{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 7px;background:var(--chip);color:var(--muted)}
.tag.emg{background:var(--ink);color:var(--surface)}
.tag.bio{background:none;border:1px solid var(--line)}
.tag.stat{background:none;color:var(--target);border:1px solid var(--target)}
.syns{grid-column:2;display:none;flex-wrap:wrap;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.ex.sel .syns{display:flex}
.syns span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--syn-soft);color:var(--ink)}
.syns em{font-style:normal;font-size:12px;color:var(--muted);width:100%}

.note{font-size:13px;color:var(--muted);line-height:1.45;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.empty button{margin-top:10px;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 12px}

.groups{display:grid;gap:16px}
.group h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group div{display:flex;flex-wrap:wrap;gap:6px}
.group button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.group button:hover{border-color:var(--target)}

details.about{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:13px;color:var(--muted)}
details.about summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.about ul{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
details.about p{margin:8px 0 0;line-height:1.45}

/* phones and narrow windows */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .seg .both{display:none}
  .legend{display:none}
  .brand small{display:none}
  .p-head{padding:12px 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-title{font-size:24px}
  .bar{padding-block:8px}
  .hint{display:none}
  main{grid-template-rows:minmax(320px,56%) minmax(0,1fr)}
}
@media (max-width:480px){.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){.m{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Atlas <b>Muscular</b></h1><small>ranking por EMG</small></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar músculo ou exercício" autocomplete="off" aria-label="Buscar músculo ou exercício">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <main>
    <section class="stage" aria-label="Boneco anatômico">
      <div class="bar">
        <div class="seg" role="group" aria-label="Vista">
          <button id="vFront" data-v="front" aria-pressed="true">Frente</button>
          <button id="vBack" data-v="back" aria-pressed="false">Costas</button>
          <button id="vBoth" class="both" data-v="both" aria-pressed="false">Ambos</button>
        </div>
        <div class="zoom">
          <button id="zIn" aria-label="Aproximar">+</button>
          <button id="zOut" aria-label="Afastar">−</button>
          <button id="zReset" aria-label="Enquadrar">⤢</button>
        </div>
        <div class="legend"><span><i class="lt"></i>Músculo alvo</span><span><i class="ls"></i>Sinergista</span></div>
      </div>
      <div class="canvas">
        <svg id="fig" preserveAspectRatio="xMidYMid meet" aria-label="Boneco com músculos clicáveis"></svg>
        <div class="hint" id="hint">Toque num músculo · pinça para zoom · arraste para mover</div>
      </div>
    </section>
    <aside class="panel">
      <div class="p-head">
        <div class="p-top">
          <div>
            <div class="eyebrow" id="cat">Escolha um músculo</div>
            <h2 class="p-title" id="title">Toque no boneco</h2>
            <p class="p-latin" id="latin">O músculo fica vermelho e a lista mostra os exercícios em ordem.</p>
          </div>
          <button class="clear" id="clear" hidden>Limpar</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Equipamento"></div>
      </div>
      <div class="p-body" id="body"></div>
    </aside>
  </main>
</div>

<script>
/* ------------------------------------------------------------------ data */
const EQ = {H:"Halteres",P:"Polia / Cabo",B:"Barra",M:"Máquina",C:"Peso corporal"};
const SRC = {
  ace_peito:"ACE (2012): EMG do peitoral em 9 exercícios de peito",
  ace_biceps:"ACE (2014): EMG do bíceps em 8 exercícios",
  ace_triceps:"ACE (2012): EMG do tríceps em 8 exercícios",
  ace_ombro:"ACE (2014): EMG dos três deltoides em 10 exercícios",
  ace_abs:"ACE (2001): EMG do reto abdominal e oblíquos em 13 exercícios",
  ace_gluteo:"ACE (2006): EMG do glúteo máximo e médio",
  contreras:"Contreras et al. (2015): elevação pélvica vs agachamento",
  mcallister:"McAllister et al. (2014): EMG dos isquiotibiais em 4 exercícios",
  andersen:"Andersen et al. (2014): largura da pegada na puxada",
  ekstrom:"Ekstrom et al. (2003): exercícios para trapézio e serrátil",
  reinold:"Reinold et al. (2004): manguito rotador e deltoide",
  distefano:"Distefano et al. (2009): glúteos em exercícios comuns",
  serner:"Serner et al. (2014): exercícios de adutores",
  ridao:"Rodríguez-Ridao et al. (2020): inclinação do banco no supino"
};
/* exercise: [pt, en, eq, evidence (E = ranking de estudo EMG, B = biomecânica), synergists, stat?] */
const M = {
  peito_superior:{n:"Peitoral superior",l:"Pectoralis major, parte clavicular",c:"Peito",s:["ridao","ace_peito"],x:[
    ["Supino inclinado com barra (≈30°)","Incline barbell bench press","B","E",["ombro_frontal","triceps_lateral","triceps_medial"]],
    ["Supino inclinado com halteres (≈30°)","Incline dumbbell press","H","B",["ombro_frontal","triceps_lateral"]],
    ["Supino inclinado no Smith ou máquina","Incline Smith / machine press","M","B",["ombro_frontal","triceps_lateral"]],
    ["Crucifixo na polia, de baixo para cima","Low-to-high cable fly","P","B",["ombro_frontal","biceps_curta"]],
    ["Supino reto com barra","Flat barbell bench press","B","E",["ombro_frontal","triceps_lateral","peito_medial"]]]},
  peito_medial:{n:"Peitoral médio",l:"Pectoralis major, parte esternocostal",c:"Peito",s:["ace_peito"],x:[
    ["Supino reto com barra","Barbell bench press","B","E",["ombro_frontal","triceps_lateral","triceps_medial"],"100% (referência)"],
    ["Voador (pec deck)","Pec deck","M","E",["ombro_frontal"],"98% do supino"],
    ["Crossover com tronco inclinado à frente","Bent-forward cable crossover","P","E",["ombro_frontal","peito_inferior"],"93% do supino"],
    ["Supino sentado na máquina","Seated chest press","M","E",["ombro_frontal","triceps_lateral"]],
    ["Crucifixo inclinado com halteres","Incline dumbbell fly","H","E",["ombro_frontal","peito_superior"]],
    ["Mergulho nas paralelas","Dips","C","E",["triceps_lateral","ombro_frontal","peito_inferior"]],
    ["Flexão de braço","Push-up","C","E",["triceps_lateral","ombro_frontal","serratil"]]]},
  peito_inferior:{n:"Peitoral inferior",l:"Pectoralis major, parte abdominal",c:"Peito",s:[],x:[
    ["Supino declinado com barra","Decline barbell bench press","B","B",["triceps_lateral","ombro_frontal","peito_medial"]],
    ["Mergulho nas paralelas, tronco à frente","Chest dips (forward lean)","C","B",["triceps_lateral","triceps_longa","ombro_frontal"]],
    ["Crossover de cima para baixo","High-to-low cable crossover","P","B",["peito_medial","ombro_frontal"]],
    ["Supino declinado com halteres","Decline dumbbell press","H","B",["triceps_lateral","ombro_frontal"]]]},
  ombro_frontal:{n:"Deltoide anterior",l:"Deltoideus, parte clavicular",c:"Ombros",s:["ace_ombro"],x:[
    ["Desenvolvimento com halteres","Dumbbell shoulder press","H","E",["ombro_lateral","triceps_lateral","triceps_longa","trapezio_superior"]],
    ["Desenvolvimento em pé com barra","Barbell overhead press","B","B",["ombro_lateral","triceps_lateral","trapezio_superior","abdomen_supra"]],
    ["Desenvolvimento na máquina","Machine shoulder press","M","B",["ombro_lateral","triceps_lateral"]],
    ["Elevação frontal com halteres","Dumbbell front raise","H","B",["peito_superior","ombro_lateral"]],
    ["Supino inclinado com halteres","Incline dumbbell press","H","B",["peito_superior","triceps_lateral"]]]},
  ombro_lateral:{n:"Deltoide lateral",l:"Deltoideus, parte acromial",c:"Ombros",s:["ace_ombro"],x:[
    ["Remada inclinada a 45° (peito apoiado, cotovelos abertos)","45° incline row","H","E",["ombro_posterior","trapezio_medio","romboides","biceps_longa"]],
    ["Elevação lateral com cotovelo flexionado","Bent-arm lateral raise","H","E",["trapezio_superior","ombro_frontal"]],
    ["Elevação lateral na polia","Cable lateral raise","P","B",["trapezio_superior"]],
    ["Elevação lateral na máquina","Machine lateral raise","M","B",["trapezio_superior"]],
    ["Desenvolvimento com halteres","Dumbbell shoulder press","H","B",["ombro_frontal","triceps_lateral"]],
    ["Remada alta com barra","Barbell upright row","B","E",["trapezio_superior","biceps_longa"]]]},
  ombro_posterior:{n:"Deltoide posterior",l:"Deltoideus, parte espinal",c:"Ombros",s:["ace_ombro"],x:[
    ["Remada inclinada a 45° (peito apoiado, cotovelos abertos)","45° incline row","H","E",["ombro_lateral","trapezio_medio","romboides","biceps_longa"]],
    ["Elevação lateral sentado, tronco inclinado","Seated rear lateral raise","H","E",["trapezio_medio","romboides","infraespinhal"]],
    ["Crucifixo inverso na máquina","Reverse pec deck","M","B",["trapezio_medio","romboides","infraespinhal"]],
    ["Face pull na polia com corda","Rope face pull","P","B",["infraespinhal","trapezio_medio","trapezio_inferior"]],
    ["Crucifixo inverso unilateral na polia","Single-arm cable rear delt fly","P","B",["trapezio_medio","infraespinhal"]]]},
  biceps_longa:{n:"Bíceps, cabeça longa",l:"Biceps brachii, caput longum",c:"Braços",s:["ace_biceps"],x:[
    ["Rosca concentrada","Concentration curl","H","E",["biceps_curta","braquial","antebraco_flexores"]],
    ["Rosca inclinada com halteres","Incline dumbbell curl","H","B",["biceps_curta","braquial"]],
    ["Rosca direta, pegada fechada","Close-grip barbell curl","B","B",["biceps_curta","braquial","antebraco_flexores"]],
    ["Rosca na polia baixa","Cable curl","P","B",["biceps_curta","braquial"]],
    ["Barra fixa supinada","Chin-up","C","B",["dorsal_superior","biceps_curta","braquial","redondo_maior"]]]},
  biceps_curta:{n:"Bíceps, cabeça curta",l:"Biceps brachii, caput breve",c:"Braços",s:["ace_biceps"],x:[
    ["Rosca concentrada","Concentration curl","H","E",["biceps_longa","braquial","antebraco_flexores"]],
    ["Rosca Scott","Preacher curl","B","B",["biceps_longa","braquial"]],
    ["Rosca spider","Spider curl","H","B",["biceps_longa","braquial"]],
    ["Rosca direta, pegada aberta","Wide-grip barbell curl","B","B",["biceps_longa","antebraco_flexores"]],
    ["Rosca Scott na máquina","Machine preacher curl","M","B",["biceps_longa","braquial"]]]},
  braquial:{n:"Braquial",l:"Brachialis",c:"Braços",s:[],x:[
    ["Rosca martelo","Hammer curl","H","B",["antebraco_braquiorradial","biceps_longa"]],

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("fig");
const BOX={front:[24,-30,452,918],back:[564,-30,452,918],both:[24,-30,992,918]};
const VG={};
const inViews={};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

function buildDefs(){
  const d=el("defs",{},svg);
  const grad=(id,a,b,c)=>{const g=el("linearGradient",{id,x1:"0",y1:"0",x2:"1",y2:"1"},d);
    [[0,a],[.55,b],[1,c]].forEach(([o,v])=>{const s=el("stop",{offset:o},g);s.style.stopColor=`var(${v})`})};
  grad("gM","--m-hi","--m","--m-lo");grad("gT","--target-hi","--target","--target-lo");
  const gs=el("linearGradient",{id:"gS",x1:"0",y1:"0",x2:"1",y2:"1"},d);
  [[0,.85],[1,.6]].forEach(([o,op])=>{const s=el("stop",{offset:o},gs);s.style.stopColor="var(--syn)";s.style.stopOpacity=op});
  return d;
}
const fibCache={};
function fibPattern(defs,a){
  const key="f"+String(a).replace("-","n");
  if(!fibCache[key]){
    const p=el("pattern",{id:key,width:"5",height:"5",patternUnits:"userSpaceOnUse",patternTransform:`rotate(${a-90})`},defs);
    const l=el("line",{x1:"0",y1:"0",x2:"0",y2:"5","stroke-width":"0.9"},p);l.style.stroke="var(--fiber)";
    fibCache[key]=1;
  }
  return `url(#${key})`;
}
function drawView(defs,name,list,dx){
  const root=el("g",{transform:`translate(${dx},0)`},svg);VG[name]=root;
  el("text",{x:250,y:-12,"text-anchor":"middle",class:"vlabel"},root).textContent=name==="front"?"FRENTE":"COSTAS";
  el("ellipse",{cx:250,cy:58,rx:31,ry:38,class:"skin"},root);
  el("path",{d:"M236,88 L264,88 L266,122 L234,122 Z",class:"skin"},root);
  const halves=[el("g",{},root),el("g",{transform:"matrix(-1,0,0,1,500,0)"},root)];
  // body silhouette
  halves.forEach(h=>SKIN.forEach(([f,d])=>el("path",{d,class:"skin",transform:FR[f]},h)));
  if(name==="front"){
    el("path",{d:"M222,62 C218,58 220,48 222,52 M278,62 C282,58 280,48 278,52",class:"detail"},root);
  }else{
    el("path",{d:"M250,170 L250,440",class:"detail"},root);
  }
  // muscles, both sides
  halves.forEach(h=>{
    list.forEach(([f,id,d,a])=>{
      const g=el("g",{"data-m":id,transform:FR[f]},h);
      el("path",{d,class:"m"},g);
      if(a!==undefined)el("path",{d,class:"fib",fill:fibPattern(defs,a)},g);
      (inViews[id]=inViews[id]||new Set()).add(name);
    });
  });
}
const defs=buildDefs();
drawView(defs,"front",FRONT,0);
drawView(defs,"back",BACK,540);
document.querySelectorAll("[data-m]").forEach(g=>{
  const t=el("title",{},g);t.textContent=M[g.dataset.m].n;g.insertBefore(t,g.firstChild);
});

/* ------------------------------------------------------- view, zoom, pan */
let view=(()=>{try{return localStorage.getItem("atlas-view")||"front"}catch(e){return "front"}})();
let vb=[...BOX[view]];
const narrow=()=>matchMedia("(max-width:900px)").matches;
function applyVB(){svg.setAttribute("viewBox",vb.map(n=>n.toFixed(2)).join(" "))}
function setView(v,keepZoom){
  if(v==="both"&&narrow())v="front";
  view=v;try{localStorage.setItem("atlas-view",v)}catch(e){}
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  VG.front.style.display=(v==="back")?"none":"";VG.back.style.display=(v==="front")?"none":"";
  if(!keepZoom){vb=[...BOX[v]];applyVB()}
}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){
  const base=BOX[view];const minW=base[2]/6;
  let nw=Math.min(base[2],Math.max(minW,vb[2]/f));const k=nw/vb[2];
  const p=(cx===undefined)?{x:vb[0]+vb[2]/2,y:vb[1]+vb[3]/2}:toSvg(cx,cy);
  vb=[p.x-(p.x-vb[0])*k,p.y-(p.y-vb[1])*k,vb[2]*k,vb[3]*k];clampVB();applyVB();
}
function clampVB(){
  const b=BOX[view];
  if(vb[2]>=b[2]-0.5){vb=[...b];return}
  vb[0]=Math.min(Math.max(vb[0],b[0]-vb[2]*0.3),b[0]+b[2]-vb[2]*0.7);
  vb[1]=Math.min(Math.max(vb[1],b[1]-vb[3]*0.3),b[1]+b[3]-vb[3]*0.7);
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));
document.getElementById("zIn").onclick=()=>zoomAt(1.4);
document.getElementById("zOut").onclick=()=>zoomAt(1/1.4);
document.getElementById("zReset").onclick=()=>{vb=[...BOX[view]];applyVB()};
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});

const ptrs=new Map();let gesture=null;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){gesture={type:"tap",sx:e.clientX,sy:e.clientY,target:e.target.closest("[data-m]"),vb0:[...vb],t:Date.now()}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gesture={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y),vb0:[...vb],mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gesture)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const scale=vb[2]/svg.getBoundingClientRect().width*Math.max(1,(svg.getBoundingClientRect().width/svg.getBoundingClientRect().height)/(vb[2]/vb[3]));
  if(gesture.type!=="pinch"&&ptrs.size===1){
    const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;
    if(gesture.type==="tap"&&Math.hypot(dx,dy)>8)gesture.type="pan";
    if(gesture.type==="pan"){
      const k=svgUnitsPerPx(gesture.vb0);
      vb=[gesture.vb0[0]-dx*k,gesture.vb0[1]-dy*k,vb[2],vb[3]];clampVB();applyVB();
    }
  }else if(gesture.type==="pinch"&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    vb=[...gesture.vb0];applyVB();zoomAt(d/gesture.d0,gesture.mid.x,gesture.mid.y);
  }
});
function svgUnitsPerPx(box){const r=svg.getBoundingClientRect();return Math.max(box[2]/r.width,box[3]/r.height)}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(gesture&&gesture.type==="tap"&&ptrs.size===0){
    if(gesture.target)selectMuscle(gesture.target.dataset.m,true);
  }
  if(ptrs.size===0)gesture=null;
  else if(ptrs.size===1&&gesture&&gesture.type==="pinch"){const p=[...ptrs.values()][0];gesture={type:"pan",sx:p.x,sy:p.y,vb0:[...vb]}}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("dblclick",e=>{e.preventDefault()});

/* --------------------------------------------------------------- panel */
let cur=null, curEx=null, eq="all";
const $=id=>document.getElementById(id);
function chips(){
  const all=[["all","Todos"],...Object.entries(EQ)];
  $("chips").innerHTML=all.map(([k,v])=>`<button data-eq="${k}" aria-pressed="${eq===k}">${v}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{eq=b.dataset.eq;curEx=null;paint();chips();render()});
}
function paint(){
  document.querySelectorAll("[data-m]").forEach(g=>g.classList.remove("on","syn"));
  if(!cur)return;
  const list=filtered();const ex=curEx!==null?list[curEx]:null;
  if(ex)ex[4].forEach(s=>{if(s!==cur)document.querySelectorAll(`[data-m="${s}"]`).forEach(g=>g.classList.add("syn"))});
  document.querySelectorAll(`[data-m="${cur}"]`).forEach(g=>g.classList.add("on"));
}
const filtered=()=>cur?M[cur].x.filter(x=>eq==="all"||x[2]===eq):[];
function selectMuscle(id,fromFigure){
  if(!M[id])return;
  cur=id;curEx=null;
  if(!fromFigure&&view!=="both"&&!inViews[id].has(view))setView(inViews[id].has("front")?"front":"back");
  paint();render();$("body").scrollTop=0;
}
function selectExercise(i){curEx=(curEx===i)?null:i;paint();render(false)}
function shortName(id){return M[id].n}
function render(scroll=true){
  const body=$("body");
  if(!cur){
    $("cat").textContent="Escolha um músculo";$("title").textContent="Toque no boneco";
    $("latin").textContent="O músculo fica vermelho e a lista mostra os exercícios em ordem.";
    $("clear").hidden=true;
    body.innerHTML=`<div class="groups">${GROUPS.map(g=>`<div class="group"><h3>${g}</h3><div>${
      Object.entries(M).filter(([,m])=>m.c===g).map(([id,m])=>`<button data-go="${id}">${m.n}</button>`).join("")}</div></div>`).join("")}</div>${about()}`;
    body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>selectMuscle(b.dataset.go));
    return;
  }
  const m=M[cur];
  $("cat").textContent=m.c;$("title").textContent=m.n;$("latin").textContent=m.l;$("clear").hidden=false;
  const list=filtered();
  let html="";
  if(!list.length){
    html=`<div class="empty">Nenhum exercício com ${EQ[eq].toLowerCase()} para este músculo.<br><button id="allEq">Mostrar todos</button></div>`;
  }else{
    const ex=curEx!==null?list[curEx]:null;
    let other="";
    if(ex&&view!=="both"){
      const ov=view==="front"?"back":"front";
      const hid=ex[4].filter(s=>s!==cur&&!inViews[s].has(view)&&inViews[s].has(ov));
      if(hid.length)other=` <button class="link" id="swap" data-v="${ov}">${hid.length===1?"1 sinergista":hid.length+" sinergistas"} na vista de ${ov==="back"?"costas":"frente"} →</button>`;
    }
    html+=`<p class="status">${ex?`Sinergistas de <b>${ex[0]}</b> marcados em laranja no boneco.${other}`:"Toque num exercício para ver os sinergistas no boneco."}</p>`;
    html+=list.map((x,i)=>{
      const [pt,en,q,ev,syn,stat]=x;
      return `<button class="ex${curEx===i?" sel":""}" data-i="${i}" aria-pressed="${curEx===i}">
        <span class="rank">${i+1}</span>
        <span class="ex-n">${pt}</span>
        <span class="ex-en">${en}</span>
        <span class="tags"><span class="tag">${EQ[q]}</span>${ev==="E"?`<span class="tag emg">Estudo EMG</span>`:`<span class="tag bio">Biomecânica</span>`}${stat?`<span class="tag stat">${stat}</span>`:""}</span>
        <span class="syns"><em>Sinergistas</em>${syn.length?syn.map(s=>`<span>${shortName(s)}</span>`).join(""):"<span>Isolado</span>"}</span>
      </button>`}).join("");
  }
  html+=`<p class="note">${m.s.length?`Ordem baseada em: ${m.s.map(k=>SRC[k]).join("; ")}. Itens marcados "Biomecânica" não entraram nesses estudos e foram encaixados pela mecânica do movimento.`:"Não há estudo de EMG que compare estes exercícios entre si para este músculo. A ordem segue a mecânica do movimento e a prática comum de treino."}</p>`;
  body.innerHTML=html;
  const a=$("allEq");if(a)a.onclick=()=>{eq="all";chips();render()};
  const sw=$("swap");if(sw)sw.onclick=()=>{setView(sw.dataset.v);render(false)};
  body.querySelectorAll(".ex").forEach(b=>b.onclick=()=>selectExercise(+b.dataset.i));
}
function about(){return `<details class="about"><summary>Como o ranking funciona</summary>
  <p>A ordem segue estudos de eletromiografia (EMG) que mediram a ativação do músculo em vários exercícios. Quando um estudo publicou o valor, ele aparece no cartão (ex.: "98% do supino").</p>
  <p><b>Estudo EMG</b>: o exercício foi medido num estudo. <b>Biomecânica</b>: não há medição comparável; a posição vem da mecânica do movimento.</p>
  <p>EMG mede ativação durante a série, não crescimento muscular. Use o ranking como guia, não como regra.</p>
  <ul>${Object.values(SRC).map(s=>`<li>${s}</li>`).join("")}</ul></details>`}
$("clear").onclick=()=>{cur=null;curEx=null;paint();render()};

/* --------------------------------------------------------------- search */
const q=$("q"),res=$("results");
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
q.addEventListener("input",()=>{
  const t=norm(q.value.trim());
  if(!t){res.hidden=true;return}
  const hits=Object.entries(M).filter(([,m])=>norm(m.n+" "+m.l+" "+m.c).includes(t)||m.x.some(x=>norm(x[0]+" "+x[1]).includes(t)));
  res.innerHTML=hits.length?hits.slice(0,12).map(([id,m])=>{
    const ex=m.x.find(x=>norm(x[0]+" "+x[1]).includes(t));
    return `<button data-go="${id}"><div class="r-n">${m.n}</div><div class="r-s">${ex&&!norm(m.n).includes(t)?"Exercício: "+ex[0]:m.c+" · "+m.x.length+" exercícios"}</div></button>`}).join("")
    :`<div class="empty">Nada encontrado para "${q.value}".</div>`;
  res.hidden=false;
  res.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{selectMuscle(b.dataset.go);res.hidden=true;q.value="";q.blur()});
});
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".search"))res.hidden=true});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){res.hidden=true;q.blur()}if(e.key==="Enter"){const b=res.querySelector("[data-go]");if(b)b.click()}});

/* ----------------------------------------------------------------- init */
chips();setView(view);render();
if(narrow())q.placeholder="Buscar";
matchMedia("(max-width:900px)").addEventListener("change",()=>setView(view));
