<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Muscular</title>
<meta name="description" content="Boneco anatômico clicável com exercícios ordenados por estudos de EMG.">
<meta name="theme-color" content="#0E1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Muscular">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: figure stage on the left (top on phones), ranked exercise panel on the right (below on phones). */
:root{
  --bg:#E9ECEF; --surface:#F7F8F9; --ink:#1A1F26; --muted:#5B6470; --line:#CDD2D8;
  --skin:#D6DADF; --m:#AEB6C0; --m-hi:#C3CAD2; --m-lo:#97A0AB; --m-edge:#E9ECEF; --fiber:rgba(26,31,38,.13);
  --target:#D3222A; --target-hi:#F04A50; --target-lo:#A0141B;
  --syn:#F08A24; --syn-soft:rgba(240,138,36,.55);
  --chip:#E1E5E9; --focus:#1A1F26; --tend:#E4E7EB; --k1:#D3222A; --k2:#2F6DB5; --band:rgba(26,31,38,.08); --hair:#6B737E; --hair-l:rgba(255,255,255,.22); --breast:rgba(255,255,255,.2); --fold:rgba(26,31,38,.16);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; --k1:#F0474D; --k2:#5B8FDB; --band:rgba(255,255,255,.09); --hair:#262D35; --hair-l:rgba(255,255,255,.08); --breast:rgba(255,255,255,.06); --fold:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; --k1:#F0474D; --k2:#5B8FDB; --band:rgba(255,255,255,.09); --hair:#262D35; --hair-l:rgba(255,255,255,.08); --breast:rgba(255,255,255,.06); --fold:rgba(0,0,0,.35); color-scheme:dark}

html{height:100%}body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--target);font-weight:700}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:1;max-width:380px;min-width:0}
.search input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .r-n{font-weight:600;font-size:14px}
.results .r-s{font-size:12px;color:var(--muted)}
.results .empty{padding:12px 14px;color:var(--muted);font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.zoom{display:inline-flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:36px;height:36px;font-weight:600;font-size:16px;display:inline-grid;place-items:center;padding:0 8px}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .lt{background:var(--target)} .legend .ls{background:var(--syn)}
.canvas{flex:1;min-height:0;position:relative}
#fig{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}

/* figure */
.skin{fill:var(--m-lo)}
.deco{pointer-events:none}
.dm{fill:url(#gM);stroke:var(--m-edge);stroke-width:1.4;stroke-linejoin:round}
.tend{fill:var(--tend);stroke:var(--m-edge);stroke-width:1;pointer-events:none}
.hair{fill:var(--hair);stroke:var(--m-edge);stroke-width:1.2;pointer-events:none}
.hair-l{fill:none;stroke:var(--hair-l);stroke-width:1.3;stroke-linecap:round;pointer-events:none}
.breast{fill:var(--breast);stroke:var(--m-edge);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.bfold{fill:none;stroke:var(--fold);stroke-width:3;stroke-linecap:round;pointer-events:none}
.seg.sex button{display:inline-grid;place-items:center;padding:6px 14px}
.seg.sex svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){#zIn,#zOut{display:none}}
.mode-art .skin,.mode-art .dm{opacity:.5}
.mode-art .tend,.mode-art .hair,.mode-art .breast,.mode-art .bfold{opacity:.6}
.m{fill:url(#gM);stroke:var(--m-edge);stroke-width:1.6;stroke-linejoin:round;transition:fill .18s}
.fib{pointer-events:none}
@media (hover:hover){[data-m]:hover .m{fill:var(--m-hi)}}
[data-m].on .m{fill:url(#gT)}
[data-m].syn .m{fill:url(#gS)}
.vlabel{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.2em;fill:var(--muted)}
.detail{fill:none;stroke:var(--m-edge);stroke-width:1.4;pointer-events:none}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-top > div{min-width:0;flex:1}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--target)}
.eyebrow-row{display:flex;align-items:center;gap:8px}
.help{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;padding:0;border:0;background:none;color:var(--muted);font-family:var(--f-body);font-size:22px;font-weight:500;line-height:1;letter-spacing:0;vertical-align:middle;cursor:pointer;position:relative}
.help::after{content:"";position:absolute;inset:-10px}
.page-h h2 .help{margin-left:10px;transform:translateY(-3px)}
.help.sm{width:18px;height:18px;font-size:18px;margin-left:4px}
.kgsl{display:inline-flex;align-items:center}
.helpb{overflow:auto;padding:0 16px 22px;font-size:15px;line-height:1.5}
.helpb p{margin:0 0 6px}
.helpb h4{margin:14px 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.helpb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.p-title{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.02;text-wrap:balance}
.p-latin{margin:4px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.clear{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.p-body{flex:1;overflow:auto;padding:14px 18px 24px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.status{font-size:13px;color:var(--muted);line-height:1.4}
.status b{color:var(--syn)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ex:hover{border-color:var(--muted)}
.ex.sel{border-color:var(--syn);box-shadow:inset 0 0 0 1px var(--syn)}
.rank{grid-row:span 3;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}
.ex[data-i="0"] .rank{color:var(--target)}
.ex-n{font-weight:600;font-size:15px;line-height:1.25}
.ex-en{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 7px;background:var(--chip);color:var(--muted)}
.tag.hyp{background:var(--target);color:#fff}
.tag.emg{background:var(--ink);color:var(--surface)}
.tag.bio{background:none;border:1px solid var(--line)}
.tag.stat{background:none;color:var(--target);border:1px solid var(--target)}
.syns{grid-column:2;display:none;flex-wrap:wrap;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.ex.sel .syns{display:flex}
.syns span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--syn-soft);color:var(--ink)}
.syns em{font-style:normal;font-size:12px;color:var(--muted);width:100%}

.note{font-size:13px;color:var(--muted);line-height:1.45;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.empty button{margin-top:10px;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 12px}

.groups{display:grid;gap:16px}
.group h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group div{display:flex;flex-wrap:wrap;gap:6px}
.group button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.group button:hover{border-color:var(--target)}

details.about{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:13px;color:var(--muted)}
details.about summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.about ul{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
details.about p{margin:8px 0 0;line-height:1.45}

/* phones and narrow windows */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .seg .both{display:none}
  .legend{display:none}
  .brand small{display:none}
  .p-head{padding:12px 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-title{font-size:24px}
  .bar{padding-block:8px}
  .hint{display:none}
  main{grid-template-rows:minmax(320px,56%) minmax(0,1fr)}
}
@media (max-width:480px){.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){.m{transition:none}}

/* ---- sections, tabs, pages ---- */
.app{grid-template-rows:auto minmax(0,1fr) auto}
.view{grid-row:2;min-height:0}
.htabs{display:flex;gap:4px}
.htabs button,.btabs button{border:0;background:none;color:var(--muted);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.htabs button{padding:7px 12px;border-radius:8px;font-size:15px}
.htabs button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.btabs{display:none}
.page{overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;box-sizing:border-box;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.page-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.02em;line-height:1}
.lead{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.day.today{border-color:var(--target);box-shadow:inset 0 0 0 1px var(--target)}
.day-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day-n{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;min-width:96px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--target);color:#fff;letter-spacing:.04em}
.inp{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
textarea.inp{min-height:60px;resize:vertical;font-family:var(--f-body);line-height:1.4}
.day-t{flex:1;min-width:150px}
.title-inp{font-family:var(--f-display);font-weight:700;font-size:22px;padding:6px 10px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 62px 76px auto;gap:8px;align-items:end;padding-top:10px;border-top:1px solid var(--line)}
.fi-n{font-weight:600;font-size:15px;align-self:center;min-width:0;line-height:1.25}
.muted-s{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.fl{display:grid;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fi-act{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;font-size:15px;padding:0}
.ib.del{color:var(--target)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--target);border-color:var(--target);background:none}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.wx-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wx-h > div:first-child{min-width:0}
.wx-n{font-weight:600;font-size:16px;line-height:1.25}
.last{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px;line-height:1.4}
.last b{color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.set-n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set.set-h span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hist{display:grid;gap:6px}
.hist button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}
.hist b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist span{color:var(--muted);font-size:13px;text-align:right;min-width:0}
.section-t{margin:12px 0 0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* ---- sheets ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;gap:8px;padding:14px 16px 10px;align-items:center}
.sheet-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;flex:1}
.sheet-s{padding:0 16px 8px}
.sheet .chips{padding:0 16px 8px}
.plist,.alist{overflow:auto;padding:4px 16px 18px;display:grid;gap:6px;align-content:start}
.plist button,.alist button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.pn{display:block;font-weight:600;font-size:14px}
.ps{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.plist .custom{border-style:dashed}
.alist .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---- exercise card add button ---- */
.ex{grid-template-columns:auto minmax(0,1fr) auto;cursor:pointer;box-sizing:border-box}
.addx{grid-column:3;grid-row:1 / span 2;align-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;padding:0;color:var(--ink)}
.syns{grid-column:2 / span 2}

/* ---- models ---- */
.joints{display:none}
.mode-art .joints{display:inline}
.mode-art [data-m]{pointer-events:none}
.mode-art .m{fill:var(--m-lo);opacity:.5}
.mode-art .fib{opacity:.4}
.jt{cursor:pointer}
.jt .jh{fill:transparent}
.jt .jd{fill:var(--surface);stroke:var(--syn);stroke-width:3}
.jt.on .jd{fill:var(--target);stroke:var(--target-hi)}
@media (hover:hover){.jt:hover .jd{fill:var(--syn-soft)}}
.jl{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.jl h4{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.jl.warm h4{color:var(--syn)} .jl.mob h4{color:var(--ink)} .jl.str h4{color:var(--target)}
.jl ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px;line-height:1.35}
.jl small{display:block;color:var(--muted);font-size:12px;margin:-4px 0 8px}

@media (max-width:900px){
  .htabs{display:none}
  .btabs{display:grid;grid-row:3;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .btabs button{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;font-size:13px}
  .btabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btabs button[aria-current="page"]{color:var(--target)}
  .seg.model{width:100%}
  .seg.model button{flex:1;padding:6px 4px;font-size:14px;letter-spacing:.03em}
  .fi{grid-template-columns:minmax(0,1fr) 58px 70px}
  .fi-act{grid-column:1 / -1;justify-content:flex-end}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:901px){.modal{align-items:center}.sheet{border-radius:16px}}

/* phone: figure fills the screen until something is picked */
@media (max-width:900px){
  #tab-atlas{display:flex;flex-direction:column;align-self:stretch;height:100%}
  #tab-atlas .stage{flex:0 0 56%;min-height:0;transition:flex-basis .35s ease}
  #tab-atlas .panel{flex:1 1 0;min-height:0}
  #tab-atlas.idle .stage{flex-basis:calc(100% - 84px)}
  #tab-atlas.idle .p-latin,#tab-atlas.idle .chips,#tab-atlas.idle .p-body{display:none}
  #tab-atlas.idle .p-head{border-bottom:0;padding-block:10px}
  #tab-atlas.idle .p-title{font-size:20px}
  #tab-atlas.covered{display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"fig head" "body body";background:var(--surface)}
  #tab-atlas.covered .stage{grid-area:fig;height:196px;align-self:start;cursor:zoom-in}
  #tab-atlas.covered .bar,#tab-atlas.covered .hint{display:none}
  #tab-atlas.covered .panel{display:contents}
  #tab-atlas.covered .p-head{grid-area:head;padding-left:6px;border-bottom:0;min-width:0}
  #tab-atlas.covered .p-top{flex-wrap:wrap;gap:8px}
  #tab-atlas.covered .p-top > div{flex-basis:100%}
  #tab-atlas.covered .p-top .clear{padding:5px 10px}
  #tab-atlas.covered .p-title{font-size:22px}
  #tab-atlas.covered .p-body{grid-area:body;border-top:1px solid var(--line);background:var(--surface)}
  .p-top .clear{flex:none}
}
@media (min-width:901px){.listbtn{display:none!important}}
/* ---- exercise variations ---- */
.vars{grid-column:2 / span 2;display:grid;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.vax{display:grid;gap:4px}
.vlab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.vopts{display:flex;flex-wrap:wrap;gap:5px}
.vopts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font-size:13px;line-height:1.2;cursor:pointer}
.vopts button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vnotes{grid-column:2 / span 2;margin:6px 0 0;padding-left:18px;display:grid;gap:3px;font-size:13px;line-height:1.4;color:var(--ink)}
.vpre{grid-column:2 / span 2;font-size:12px;color:var(--muted);margin-top:4px}
.vpre.warn{color:var(--target);font-weight:600}
.syns span.tg{background:color-mix(in srgb,var(--target) 18%,transparent)}
.pfam{display:grid;gap:8px}
.pfam.open{border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface)}
.pfam .vars{grid-column:auto;margin:0;padding:4px 6px 0}
.pfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0 6px 4px}
.plist .pfam > button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
/* ---- meus treinos / hoje ---- */
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk{background:var(--bg);border-radius:8px;padding:7px 3px;display:grid;gap:3px;text-align:center;align-content:start;min-width:0}
.wk b{font-family:var(--f-display);font-size:14px;letter-spacing:.04em}
.wk span{font-size:11px;line-height:1.2;color:var(--ink);overflow-wrap:break-word;hyphens:auto;padding-top:3px;border-top:1px solid var(--line)}
.wk span.rest{color:var(--muted);border-top:0}
.wk small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.wk.did{background:color-mix(in srgb,var(--target) 12%,var(--bg))}
button.wk{border:0;font:inherit;color:inherit;cursor:pointer;width:100%}
.wk.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.wk.today.sel{box-shadow:inset 0 0 0 2px var(--target)}
.wk.fut{opacity:.4}
.wkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.wkrow .ib{width:28px;height:44px;font-size:18px}
.wkrow .ib:disabled{opacity:.3}
.pastbox{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--surface)}
.pastbox b{display:block;font-size:15px}
.pastbox span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.wk.did span{border-top-color:color-mix(in srgb,var(--target) 35%,transparent)}
.wk.today{box-shadow:inset 0 0 0 1.5px var(--target)}
.plan-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;cursor:pointer}
.plan-h > span:first-child{min-width:0}
.chev{flex:none;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.dpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dpick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted)}
.dpick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill.soft{background:var(--chip);color:var(--muted)}
.more summary{cursor:pointer;font-weight:600;font-size:15px}
.donebtn{padding:14px;font-size:16px}
.donebox.isdone,.tcard.isdone{border-color:var(--target)}
.btn:disabled{opacity:.45}
.alist .custom{border-style:dashed}
.page .link{padding:4px 0;font-size:15px;cursor:pointer;text-decoration:none}
/* ---- progress tab ---- */
.radar{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;overflow:visible;touch-action:manipulation}
.rd-grid{fill:none;stroke:var(--line);stroke-width:1}
.rd-band{fill:var(--band)}
.rd-ring{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.rd-area{fill:color-mix(in srgb,var(--target) 22%,transparent);stroke:var(--target);stroke-width:2;stroke-linejoin:round}
.rd-pt{fill:var(--target);stroke:var(--surface);stroke-width:2}
.rd-n{fill:var(--muted);font-size:13px;font-weight:600;font-family:var(--f-body)}
.rd-v{fill:var(--ink);font-size:15px;font-weight:700;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.rd-dot{font-size:11px}
.rd-lab.on .rd-n{fill:var(--ink)}
.rd-hit{fill:transparent;cursor:pointer}
.rd-key{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rd-key i{width:14px;height:10px;border-radius:3px;background:var(--band);border:1px dashed var(--muted)}
.rd-sel{display:grid;gap:7px;background:var(--bg);border-radius:12px;padding:11px 12px}
.rd-part{display:grid;grid-template-columns:minmax(0,1fr) 40% 34px;gap:10px;align-items:center;font-size:14px}
.rd-part b{text-align:right;font-variant-numeric:tabular-nums}
.pfig.focus [data-m] .m{opacity:.35}
.pfig.focus [data-m].hl .m{opacity:1;stroke:var(--ink);stroke-width:2.5}
.seg.pview{display:flex}.seg.pview button{flex:1}
.kglegend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.kglegend span,.kgtip span{display:inline-flex;align-items:center;gap:6px}
.kglegend i,.kgtip i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--k1)}
.kglegend i.k2,.kgtip i.k2{border-top:2.5px dashed var(--k2)}
.kg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;cursor:pointer}
.kgdelta{flex:none;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--chip);border-radius:8px;padding:5px 9px}
.seg.kgr{align-self:start}
.kgchart{position:relative;min-width:0}
.kgsvg{display:block;width:100%;height:auto;touch-action:pan-y}
.kg-grid{stroke:var(--line);stroke-width:1}
.kg-ax{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.kg-l1{fill:none;stroke:var(--k1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.kg-l2{fill:none;stroke:var(--k2);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round;stroke-linecap:round}
.kg-d1{fill:var(--k1);stroke:var(--surface);stroke-width:2}
.kg-d2{fill:var(--k2);stroke:var(--surface);stroke-width:2}
.kg-cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.kg-hit{fill:transparent;cursor:crosshair}
.kgtip{position:absolute;top:0;width:176px;box-sizing:border-box;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.35;display:grid;gap:2px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.kgtip[hidden]{display:none}
.kgstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kgstats div{background:var(--bg);border-radius:10px;padding:9px 11px;display:grid;gap:1px;min-width:0}
.kgstats span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.kgstats b{font-family:var(--f-display);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.kgstats small{font-size:12px;color:var(--muted)}
.kgtab{display:grid;gap:0;font-size:14px}
.kgrow{display:grid;grid-template-columns:70px minmax(0,1fr) 90px;gap:8px;padding:7px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kgrow span:last-child{text-align:right}
.kghead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);border-top:0}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav .plabel{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-align:center;flex:1;min-width:0}
.pnav .ib:disabled{opacity:.35}
.pfig{display:block;width:100%;height:auto;max-height:min(60vh,520px);touch-action:manipulation}
.pfig .m{fill:var(--m);transition:none}
.pfig .dm{fill:var(--m-hi)}
.pfig .skin{fill:var(--m-lo)}
.pfig .fib{display:none}
.pfig [data-m]{cursor:pointer}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.bands div{display:grid;gap:2px;align-content:start;min-width:0}
.bands i{display:block;height:10px;border-radius:3px}
.bands div:first-child i{border-radius:6px 3px 3px 6px}.bands div:last-child i{border-radius:3px 6px 6px 3px}
.bands b{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.bands small{font-size:11px;line-height:1.2;color:var(--muted)}
.pg-b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.pg-b i{width:8px;height:8px;border-radius:50%;flex:none}
.warnbox{border:1px solid var(--target);background:color-mix(in srgb,var(--target) 8%,var(--surface));border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.warnbox b{display:block;color:var(--target);margin-bottom:2px}
.pstat{display:flex;gap:10px}
.pstat > div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px}
.pstat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.05}
.pstat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pg{border-top:1px solid var(--line)}
.pg summary{display:grid;grid-template-columns:minmax(0,1fr) 38% 40px;gap:10px;align-items:center;padding:11px 2px;cursor:pointer;list-style:none}
.pg summary::-webkit-details-marker{display:none}
.pg-n{font-weight:600;font-size:15px}
.pg-bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.pg-bar i{display:block;height:100%;border-radius:5px}
.pg summary b{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
.pg-parts{display:grid;gap:6px;padding:0 2px 12px 12px}
.pg-parts div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.pg-parts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){#tab-atlas .stage{transition:none}}
/* ---- ranking de força ---- */
:root{--lv0:#7fb0ec;--lv1:#6e9cd5;--lv2:#5e89bf;--lv3:#4e76aa;--lv4:#3f6394;--lv5:#305180;--lv6:#21406c;--lv7:#132f58;--lv8:#061f45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lv0:#1a5299;--lv1:#3465a6;--lv2:#4d78b3;--lv3:#658bc0;--lv4:#7d9fcc;--lv5:#95b2d8;--lv6:#aec6e5;--lv7:#c7daf1;--lv8:#e1eefd}}
:root[data-theme="dark"]{--lv0:#1a5299;--lv1:#3465a6;--lv2:#4d78b3;--lv3:#658bc0;--lv4:#7d9fcc;--lv5:#95b2d8;--lv6:#aec6e5;--lv7:#c7daf1;--lv8:#e1eefd}
button.brand{border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;color:inherit;text-align:left;align-items:center;gap:6px}
button.brand:hover{background:var(--chip)}
button.brand .trophy{width:17px;height:17px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.brand[aria-current="page"] .trophy{stroke:var(--target)}
.rk-back{border:0;background:none;padding:0 0 8px;color:var(--muted);font-weight:600;font-size:14px}
.rk-me{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.rk-bw,.rk-sexw{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.rk-bwi{display:flex;align-items:center;gap:6px;max-width:150px}.rk-bwi small{font-size:14px;text-transform:none;letter-spacing:0;font-weight:500}
.rk-note{grid-column:1/-1;margin:0}
.rk-hero{border-radius:16px;padding:18px 16px 16px;display:grid;gap:6px;color:#fff;background:linear-gradient(140deg,#0b2f60 0%,#1e4376 55%,#30588d 100%);box-shadow:0 6px 20px rgba(11,47,96,.25)}
.rk-eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.rk-big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.95;letter-spacing:.02em;text-transform:uppercase}
.rk-sub{font-size:14px;line-height:1.4;opacity:.9}.rk-sub.sm{font-size:12px;opacity:.75}
.rk-ladder{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
.rk-ladder span{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.02em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.62);white-space:nowrap}
.rk-ladder .past{background:rgba(255,255,255,.28);color:#fff}
.rk-ladder .now{background:#fff;color:#0b2f60;font-weight:700}
.rk-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.rk-legend span{display:flex;align-items:center;gap:5px}.rk-legend i{width:12px;height:12px;border-radius:3px;flex:none}
.rk-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.pg-n .rk-chip{display:flex;margin-top:3px;font-weight:500;color:var(--muted)}
.rk-chip i{width:10px;height:10px;border-radius:50%;flex:none}
.rk-bar{position:relative;display:block;height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:5px}
.rk-bar b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface);opacity:.9}
.rk-g summary{grid-template-columns:minmax(0,1fr) 38% 44px}
.rk-exs{display:grid;gap:12px;padding:4px 2px 14px}
.rk-ex{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rk-exn{font-weight:600;font-size:14px;min-width:0}.rk-exn small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.rk-next{font-size:12px;color:var(--muted)}
.rk-man{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:var(--target);font-size:12px;font-weight:600;text-decoration:underline}
.rk-form{border-color:var(--ink)}
.rk-inps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rk-inps label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.rfig{max-height:min(56vh,480px)}
@media (max-width:430px){.rk-big{font-size:44px}}
</style>

<body>
<div class="app" id="app">
  <header>
    <button class="brand" id="brandBtn" aria-label="Atlas Muscular: abrir o ranking de força" title="Ranking de força"><h1>Atlas <b>Muscular</b></h1><svg class="trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H4.5v1.5A3.5 3.5 0 0 0 8 11M16 6h3.5v1.5A3.5 3.5 0 0 1 16 11M12 13v4M8.5 20h7M10 17h4v3h-4z"/></svg></button>
    <nav class="htabs" aria-label="Seções">
      <button data-tab="atlas">Atlas</button>
      <button data-tab="ficha">Meus treinos</button>
      <button data-tab="treino">Hoje</button>
      <button data-tab="prog">Progresso</button>
    </nav>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar músculo ou exercício" autocomplete="off" aria-label="Buscar músculo ou exercício">
      <div class="results" id="results" hidden></div>
    </div>
  </header>

  <main id="tab-atlas" class="view">
    <section class="stage" aria-label="Boneco anatômico">
      <div class="bar">
        <div class="seg model" role="group" aria-label="Modelo">
          <button data-model="det" aria-pressed="true">Detalhado</button>
          <button data-model="bas" aria-pressed="false">Básico</button>
          <button data-model="art" aria-pressed="false">Articulações</button>
        </div>
        <div class="seg" role="group" aria-label="Vista">
          <button id="vFront" data-v="front" aria-pressed="true">Frente</button>
          <button id="vBack" data-v="back" aria-pressed="false">Costas</button>
          <button id="vBoth" class="both" data-v="both" aria-pressed="false">Ambos</button>
        </div>

  const grad=(id,a,b,c)=>{const g=el("linearGradient",{id,x1:"0",y1:"0",x2:"1",y2:"1"},d);
    [[0,a],[.55,b],[1,c]].forEach(([o,v])=>{const s=el("stop",{offset:o},g);s.style.stopColor=`var(${v})`})};
  grad("gM","--m-hi","--m","--m-lo");grad("gT","--target-hi","--target","--target-lo");
  const gs=el("linearGradient",{id:"gS",x1:"0",y1:"0",x2:"1",y2:"1"},d);
  [[0,.85],[1,.6]].forEach(([o,op])=>{const s=el("stop",{offset:o},gs);s.style.stopColor="var(--syn)";s.style.stopOpacity=op});
  return d;
}
const fibCache={};
function fibPattern(defs,a){
  const key="f"+String(a).replace("-","n");
  if(!fibCache[key]){
    const p=el("pattern",{id:key,width:"5",height:"5",patternUnits:"userSpaceOnUse",patternTransform:`rotate(${a-90})`},defs);
    const l=el("line",{x1:"0",y1:"0",x2:"0",y2:"5","stroke-width":"0.9"},p);l.style.stroke="var(--fiber)";
    fibCache[key]=1;
  }
  return `url(#${key})`;
}

let BD,FRX,JPT;
function shapeBody(){
  BD=BODY[sex];FRX={t:""};const pts={},rad=a=>a*Math.PI/180,f=n=>n.toFixed(1);
  const chain=(start,keys,segs)=>{let [x,y]=start;keys.forEach((k,i)=>{const [a,L,w]=segs[i];
    FRX[k]=`translate(${f(x)},${f(y)}) rotate(${a}) scale(${w},1)`;pts[k]=[x,y];x-=L*Math.sin(rad(a));y+=L*Math.cos(rad(a))});return [x,y]};
  chain(BD.S,["ua","fa","hd"],BD.arm);const ank=chain(BD.H,["th","sh"],BD.leg);
  JPT={ombro:[pts.ua[0],pts.ua[1]-2],cotovelo:pts.fa,punho:pts.hd,quadril:[pts.th[0]-4,pts.th[1]-4],joelho:[pts.sh[0],pts.sh[1]-1],tornozelo:ank};
}
function wscale(y){const w=BD.w;if(y<=w[0][0])return w[0][1];
  for(let i=1;i<w.length;i++)if(y<=w[i][0]){const [y0,s0]=w[i-1],[y1,s1]=w[i];const t=(y-y0)/(y1-y0);return s0+(s1-s0)*t*t*(3-2*t)}
  return w[w.length-1][1]}
/* trained shoulders: the outer part of the torso between y 140 and 250 (deltoid cap) is pushed out a little more */
const bump=y=>y<=135||y>=255?0:Math.sin(Math.PI*(y-135)/120);
const warp=d=>d.replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g,(_,x,y)=>{x=+x;y=+y;let nx=250-(250-x)*wscale(y);
  if(x<196)nx-=BD.delt*(196-x)*bump(y);return nx.toFixed(1)+","+y});

/* ------------------------------------------------------- view, zoom, pan */
let view=(()=>{try{const v=localStorage.getItem("atlas-view");return ["front","back","both"].includes(v)?v:"front"}catch(e){return "front"}})();
let vb=[...BOX[view]];
const narrow=()=>matchMedia("(max-width:900px)").matches;
function applyVB(){svg.setAttribute("viewBox",vb.map(n=>n.toFixed(2)).join(" "))}
function setView(v,keepZoom){
  if(v==="both"&&narrow())v="front";
  view=v;try{localStorage.setItem("atlas-view",v)}catch(e){}
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  VG.front.style.display=(v==="back")?"none":"";VG.back.style.display=(v==="front")?"none":"";
  if(!keepZoom){vb=[...BOX[v]];applyVB()}
}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){
  const base=BOX[view];const minW=base[2]/6;
  let nw=Math.min(base[2],Math.max(minW,vb[2]/f));const k=nw/vb[2];
  const p=(cx===undefined)?{x:vb[0]+vb[2]/2,y:vb[1]+vb[3]/2}:toSvg(cx,cy);
  vb=[p.x-(p.x-vb[0])*k,p.y-(p.y-vb[1])*k,vb[2]*k,vb[3]*k];clampVB();applyVB();
}
function clampVB(){
  const b=BOX[view];
  if(vb[2]>=b[2]-0.5){vb=[...b];return}
  vb[0]=Math.min(Math.max(vb[0],b[0]-vb[2]*0.3),b[0]+b[2]-vb[2]*0.7);
  vb[1]=Math.min(Math.max(vb[1],b[1]-vb[3]*0.3),b[1]+b[3]-vb[3]*0.7);
}
document.querySelectorAll(".seg [data-v]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));
document.getElementById("zIn").onclick=()=>zoomAt(1.4);
document.getElementById("zOut").onclick=()=>zoomAt(1/1.4);
document.getElementById("zReset").onclick=()=>{vb=[...BOX[view]];applyVB()};
svg.addEventListener("wheel",e=>{e.preventDefault();if(document.getElementById("tab-atlas").classList.contains("covered"))return;zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});

const ptrs=new Map();let gesture=null;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){gesture={type:"tap",sx:e.clientX,sy:e.clientY,target:e.target.closest("[data-j],[data-m]"),vb0:[...vb],t:Date.now()}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gesture={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y),vb0:[...vb],mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gesture)return;
  if(document.getElementById("tab-atlas").classList.contains("covered"))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const scale=vb[2]/svg.getBoundingClientRect().width*Math.max(1,(svg.getBoundingClientRect().width/svg.getBoundingClientRect().height)/(vb[2]/vb[3]));
  if(gesture.type!=="pinch"&&ptrs.size===1){
    const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;
    if(gesture.type==="tap"&&Math.hypot(dx,dy)>8)gesture.type="pan";
    if(gesture.type==="pan"){
      const k=svgUnitsPerPx(gesture.vb0);
      vb=[gesture.vb0[0]-dx*k,gesture.vb0[1]-dy*k,vb[2],vb[3]];clampVB();applyVB();
    }
  }else if(gesture.type==="pinch"&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    vb=[...gesture.vb0];applyVB();zoomAt(d/gesture.d0,gesture.mid.x,gesture.mid.y);
  }
});
function svgUnitsPerPx(box){const r=svg.getBoundingClientRect();return Math.max(box[2]/r.width,box[3]/r.height)}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(gesture&&gesture.type==="tap"&&ptrs.size===0){
    if(gesture.target||document.getElementById("tab-atlas").classList.contains("covered"))onFigTap(gesture.target||svg);
  }
  if(ptrs.size===0)gesture=null;
  else if(ptrs.size===1&&gesture&&gesture.type==="pinch"){const p=[...ptrs.values()][0];gesture={type:"pan",sx:p.x,sy:p.y,vb0:[...vb]}}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("dblclick",e=>{e.preventDefault()});

function basicList(g){
  const lists=BASIC[g].m.map(id=>M[id].x);const out=[],seen=new Set();
  const max=Math.max(...lists.map(l=>l.length));
  for(let r=0;r<max;r++)lists.forEach(l=>{const x=l[r];const k=x&&splitKey(x.f,x.pre);if(x&&!seen.has(k)){seen.add(k);out.push(x)}});

}

function about(){return `<details class="about"><summary>Como o ranking funciona</summary>

  <p><b>Sinergistas</b> (laranja): músculos que ajudam a fazer o movimento, do mais para o menos importante. Cada exercício tem uma lista única de músculos, então ele mostra os mesmos sinergistas em qualquer músculo em que aparece. Estabilizadores só entram quando o exercício os treina de propósito (prancha, caminhada do fazendeiro, pegada pesada). Alguns músculos pequenos, como o supraespinhal e o peitoral menor, não estão no boneco. Exercícios de isolamento, como rosca de punho, aparecem como "Isolado".</p>

/* ---------------------------------------------------------- data
   plans: my workouts, independent of the calendar: {id,name,days:[0..6],items:[{name,sets,reps}]}
   workouts: what was done on a date. done:false = started, not counted; done:true = counted.
   Older logs have no done field and count their filled sets, as before. */
let workouts=LS.get("atlas-workouts",[]);if(!Array.isArray(workouts))workouts=[];
function planFromFicha(f){
  const out=[];if(!f||!Array.isArray(f.days))return out;
  f.days.forEach((d,i)=>{if(!d||!Array.isArray(d.items)||!d.items.length)return;
    const items=d.items.map(it=>({name:it.name,sets:it.sets,reps:it.reps??""})),name=d.title||`Treino de ${DAYS[i].toLowerCase()}`;
    const same=out.find(p=>p.name===name&&JSON.stringify(p.items)===JSON.stringify(items));
    if(same)same.days.push(i);else out.push({id:uid(),name,days:[i],items})});
  return out;
}
let plans=LS.get("atlas-plans",null);
if(!Array.isArray(plans)){plans=planFromFicha(LS.get("atlas-ficha",null));LS.set("atlas-plans",plans)}
function savePlans(){if(!LS.set("atlas-plans",plans))toast("Não foi possível salvar neste aparelho")}
function saveW(){if(!LS.set("atlas-workouts",workouts))toast("Não foi possível salvar neste aparelho")}
function newPlan(){const pl={id:uid(),name:"",days:[],items:[]};plans.push(pl);return pl}
function mkItem(name,sets,reps,ref){return {name,ref:ref||null,target:reps||"",notes:"",sets:Array.from({length:Math.max(1,Math.min(10,parseInt(sets)||3))},()=>({r:"",kg:""}))}}
function startPlan(pl,date){
  const w={id:uid(),date:date||isoDate(new Date()),title:pl?(pl.name||"Treino"):"Treino personalizado",planId:pl?pl.id:null,done:false,notes:"",
    items:pl?pl.items.map(it=>mkItem(it.name,it.sets,it.reps,it.ref)):[]};
  workouts.push(w);saveW();return w;
}
function lastFor(name,w){
  const prev=workouts.filter(x=>x.id!==w.id&&x.date<=w.date).sort((a,b)=>a.date<b.date?1:-1);
  for(const p of prev){const it=p.items.find(i=>i.name===name);if(!it)continue;
    const done=it.sets.filter(s=>s.r!==""||s.kg!=="");if(done.length)return {date:p.date,sets:done}}
  return null;
}
const setTxt=s=>`${s.r||"–"}${s.kg!==""?` × ${s.kg} kg`:""}`;
const isCustom=w=>!w.planId||!plans.some(p=>p.id===w.planId);
const saveBtn=w=>`<button class="btn" data-act="savePlan" data-wid="${w.id}"${w.items.length?"":" disabled"}>Salvar em Meus treinos</button>`;
const statusPill=w=>w.done===false?`<span class="pill soft">Não feito</span>`:`<span class="pill">Feito ✓</span>`;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);

let openPlan=null,askDelPlan=null;
function renderFicha(){
  const d=todayIdx();
  let h=`<div class="page-h"><h2>Meus treinos<button class="help" data-help="ficha" aria-label="Sobre esta página" title="Sobre esta página">+</button></h2><p class="lead">Monte seus treinos aqui. Para registrar um treino, vá na aba Hoje e toque em Marcar como feito.</p></div>`;
  h+=plans.map(p=>{const open=openPlan===p.id;
    return `<section class="card plan" data-pid="${p.id}">
      <button class="plan-h" data-act="toggle" data-pid="${p.id}" aria-expanded="${open}"><span><span class="wx-n">${esc(p.name||"Treino sem nome")}</span><span class="muted-s">${daysTxt(p)} · ${plural(p.items.length,"exercício")}</span></span><span class="chev" aria-hidden="true">${open?"Fechar":"Editar"}</span></button>
      ${open?`<input class="inp title-inp" data-pf="name" data-pid="${p.id}" value="${esc(p.name)}" placeholder="Nome, ex.: Peito e tríceps" aria-label="Nome do treino">
      <div><div class="fl" style="margin-bottom:6px">Dias da semana (opcional)</div><div class="dpick" role="group" aria-label="Dias da semana">${DSH.map((n,i)=>`<button data-act="day" data-pid="${p.id}" data-day="${i}" aria-pressed="${p.days.includes(i)}" aria-label="${DAYS[i]}">${n}</button>`).join("")}</div><span class="muted-s">Nos dias marcados, este treino aparece primeiro na aba Hoje.</span></div>
      ${p.items.length?p.items.map((it,j)=>`<div class="fi">
        <div class="fi-n">${esc(it.name)}<span class="muted-s">${esc(muscleLabel(it.name,it.ref))}</span></div>
        <label class="fl">Séries<input class="inp" inputmode="numeric" data-pid="${p.id}" data-j="${j}" data-f="sets" value="${esc(it.sets)}"></label>
        <label class="fl">Reps<input class="inp" data-pid="${p.id}" data-j="${j}" data-f="reps" value="${esc(it.reps)}"></label>
        <div class="fi-act"><button class="ib" data-act="up" data-pid="${p.id}" data-j="${j}" aria-label="Subir">↑</button><button class="ib" data-act="down" data-pid="${p.id}" data-j="${j}" aria-label="Descer">↓</button><button class="ib del" data-act="rm" data-pid="${p.id}" data-j="${j}" aria-label="Remover ${esc(it.name)}">✕</button></div>
      </div>`).join(""):`<p class="muted">Nenhum exercício ainda.</p>`}
      <div class="row"><button class="btn" data-act="add" data-pid="${p.id}">+ Adicionar exercício</button></div>
      <div class="confirm">${askDelPlan===p.id?`<span>Excluir este treino? O que você já fez continua no histórico.</span><button class="btn danger" data-act="delPlan" data-pid="${p.id}">Excluir</button><button class="btn" data-act="noDelPlan">Cancelar</button>`:`<button class="btn danger" data-act="askDelPlan" data-pid="${p.id}">Excluir treino</button>`}</div>`:""}
    </section>`}).join("");
  if(!plans.length)h+=`<div class="card"><p class="muted">Você ainda não tem treinos. Crie o primeiro, por exemplo "Peito e tríceps", e escolha os dias.</p></div>`;
  h+=`<button class="btn primary wide" data-act="newPlan">+ Novo treino</button>
    <button class="btn wide" data-act="todayOnly">Montar um treino só para hoje</button>`;
  $("fichaBody").innerHTML=h;
}
const planOf=el=>plans.find(x=>x.id===el.dataset.pid);
$("fichaBody").addEventListener("input",e=>{
  const t=e.target,pl=planOf(t);if(!pl)return;
  if(t.dataset.pf==="name"){pl.name=t.value;const n=t.closest(".plan").querySelector(".plan-h .wx-n");if(n)n.textContent=t.value||"Treino sem nome"}
  else if(t.dataset.f)pl.items[+t.dataset.j][t.dataset.f]=t.value;
  else return;
  savePlans();
});
$("fichaBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,pl=planOf(b),j=+b.dataset.j;
  if(a==="newPlan"){const n=newPlan();openPlan=n.id;askDelPlan=null;savePlans();renderFicha();
    const c=document.querySelector(`.plan[data-pid="${n.id}"]`);if(c){c.scrollIntoView({block:"start",behavior:"smooth"});const i=c.querySelector("[data-pf]");if(i)i.focus({preventScroll:true})}return}
  if(a==="noDelPlan"){askDelPlan=null;return renderFicha()}
  if(a==="todayOnly"){const nw=startPlan(null);setTab("treino");openW=nw.id;renderTreino();$("tab-treino").scrollTop=0;return}
  if(!pl)return;
  if(a==="toggle"){openPlan=openPlan===pl.id?null:pl.id;askDelPlan=null}
  else if(a==="day"){const d=+b.dataset.day;pl.days=pl.days.includes(d)?pl.days.filter(x=>x!==d):[...pl.days,d]}
  else if(a==="add")return openPicker(`Adicionar a ${pl.name||"treino"}`,(name,ref)=>{pl.items.push({name,ref,sets:3,reps:"8-12"});savePlans();renderFicha()});
  else if(a==="rm")pl.items.splice(j,1);
  else if(a==="up"&&j>0)[pl.items[j-1],pl.items[j]]=[pl.items[j],pl.items[j-1]];
  else if(a==="down"&&j<pl.items.length-1)[pl.items[j+1],pl.items[j]]=[pl.items[j],pl.items[j+1]];
  else if(a==="askDelPlan")askDelPlan=pl.id;
  else if(a==="delPlan"){plans=plans.filter(x=>x.id!==pl.id);openPlan=null;askDelPlan=null;toast("Treino excluído")}
  savePlans();renderFicha();
});

function wCard(x){return `<div class="card tcard"><div class="row between"><div><div class="wx-n">${esc(x.title||"Treino")}</div><span class="muted-s">${x.items.length?x.items.map(it=>esc(it.name)).join(" · "):"Sem exercícios"}</span></div>${statusPill(x)}</div>

/* this week (Mon–Sun) with what was actually done each day */
/* day being logged in Hoje: null = today. Only today or the past can be picked, never the future. */
let hDate=null,hWeek=0;
const selDate=()=>hDate||isoDate(new Date());
const fromIso=iso=>new Date(iso+"T12:00:00");
const dayIdxOf=iso=>(fromIso(iso).getDay()+6)%7;
/* the week (Mon–Sun) with what was actually done each day; past days and today can be tapped */
function weekDone(){
  const t=new Date();t.setHours(12,0,0,0);const today=isoDate(t),sel=selDate();
  const mon=new Date(t);mon.setDate(t.getDate()-todayIdx()+7*hWeek);

function tally(r){

/* Bands from the research summary in "Como as faixas foram definidas".

  day:{t:[3,6,11],max:16,bar:14,names:["Não treinado","Leve","Bom","Forte","Pouco ganho extra"],ranges:["0","1–2","3–5","6–11","12+"],

const bandOf=(v,B)=>v<=0?0:v>B.t[2]?4:v>=B.t[1]?3:v>=B.t[0]?2:1;

  for(let i=1;i<st.length;i++)if(v<=st[i][0]){const [v0,c0]=st[i-1],[v1,c1]=st[i];const f=(v-v0)/(v1-v0);const a=rgb(c0),b=rgb(c1);

function bandsInfo(){return `<details class="about"><summary>Como as faixas foram definidas</summary>
  <p>As séries contam como nos estudos: série do músculo alvo vale 1, de sinergista vale ½. As faixas valem para o músculo inteiro (o número de cada grupo na lista). No boneco, cada parte é pintada pelo próprio número.</p>
  <p><b>Semana.</b> Cerca de 4 séries já dão crescimento mensurável. 10 ou mais são necessárias para maximizar. Entre 12 e 20 é a provável faixa ideal para quem já treina. Acima de 20 ainda pode ajudar, mas cada série a mais rende menos e quase não há estudos acima de 25–30.</p>

function drawKg(box,all){

  const line=(key,cls)=>{const q=pts.filter(x=>x[key]);if(q.length<2)return "";return `<path class="${cls}" d="${q.map((x,i)=>`${i?"L":"M"}${X(x).toFixed(1)},${Y(x[key]).toFixed(1)}`).join(" ")}"/>`};
  const dots=(key,cls)=>pts.filter(x=>x[key]).map(x=>`<circle class="${cls}" cx="${X(x).toFixed(1)}" cy="${Y(x[key]).toFixed(1)}" r="4"/>`).join("");

    <line class="kg-cross" x1="0" x2="0" y1="${T}" y2="${H-Bm}" style="display:none"/><rect class="kg-hit" x="${L}" y="0" width="${W-L-R}" height="${H}"/></svg>

  <p><b>De onde vêm os números.</b> As faixas são os padrões de força do Strength Level, feitos com cerca de 11 milhões de registros de pessoas que treinam (entre 48 milhões de levantamentos enviados). As faixas do site são percentis entre pessoas do mesmo sexo: iniciante 5%, novato 20%, intermediário 50%, avançado 80% e elite 95%. O app usa o corpo ♂/♀ escolhido.</p>
  <p><b>Os 9 níveis</b> (quanto % de quem treina você supera): Ameba = menos de 5% · Aprendiz = 5–15% · Frango = 15–30% · Galo = 30–45% · Fortinho = 45–60% · Parrudo = 60–75% · Monstro = 75–88% · Lenda = 88–96% · Bizarro = top 4%. Os níveis do meio têm a mesma largura; as pontas são mais difíceis. Entre as faixas do site, o app interpola.</p>
  <p><b>Peso corporal.</b> As faixas publicadas são para o praticante típico (cerca de 77 kg no masculino e 65 kg no feminino). O app ajusta para o seu peso pela regra de ⅔: a força cresce com a área do músculo, que acompanha o peso elevado a ⅔. Quem é mais leve precisa levantar menos, mas não proporcionalmente menos.</p>
  <p><b>Sua força em cada exercício.</b> Para cada série, o app calcula a força estimada (carga × (1 + repetições ÷ 30), fórmula de Epley) e guarda a melhor dos últimos 6 meses, dos treinos marcados como feitos ou digitada aqui. Séries de até ~12 repetições dão a estimativa mais confiável. Em barra fixa e mergulho conta o peso do corpo mais o peso extra; na barra assistida (graviton), a ajuda é descontada.</p>
  <p><b>Nível do grupo.</b> É a média de <b>todos</b> os exercícios do grupo que você fez, não só um. Um exercício conta para cada grupo que ele tem como alvo (ex.: agachamento conta para quadríceps e glúteos). O nível geral é a média dos grupos.</p>
  <p><b>Aproximações.</b> Halteres: o peso é de cada halter. Variações sem padrão próprio usam o mais próximo com um fator (ex.: supino inclinado com halteres ≈ 90% do reto; máquina com um braço só ≈ metade do peso dos dois). Exercícios só com o peso do corpo (flexão, prancha) e muito leves ficam fora. Máquinas variam de marca para marca, então use o nível delas como referência, não como verdade absoluta.</p>
  <ul><li>Strength Level: padrões de força por exercício, sexo e peso corporal (strengthlevel.com)</li><li>StrengthLog: padrões de força em kg para agachamento, terra, supino e desenvolvimento (strengthlog.com)</li><li>Jaric (2002, Sports Medicine): normalizar força pelo peso corporal elevado a ⅔</li><li>Epley (1985): fórmula da força estimada</li></ul></details>`}
function renderRank(){
  const D=rankData(),body=$("rankBody"),has=D.list.length>0,lv=has?rLv(D.all):-1;
  const hero=has?`<div class="rk-hero"><span class="rk-eyebrow">Nível geral</span><b class="rk-big">${RLV[lv][0]}</b>
      <span class="rk-sub">${RLV[lv][1]} · mais forte que ~${rPct(D.all)}% de quem treina, do mesmo sexo.</span>
      <div class="rk-ladder" role="list" aria-label="Os 9 níveis">${RLV.map((x,i)=>`<span role="listitem" class="${i<lv?"past":i===lv?"now":""}"${i===lv?' aria-current="true"':""}>${x[0]}</span>`).join("")}</div>
      <span class="rk-sub sm">${plural(D.gs.length,"grupo")} de ${Object.keys(BASIC).length} avaliado${D.gs.length===1?"":"s"} · ${plural(D.list.length,"exercício")} · corpo ${sex==="f"?"feminino":"masculino"}, ${fkg(rBW())} kg${rank.bw>0?"":" (padrão)"}</span></div>`
    :`<div class="rk-hero"><span class="rk-eyebrow">Nível geral</span><b class="rk-big">Sem dados</b>
      <span class="rk-sub">Anote carga e repetições nos treinos da aba Hoje e marque como feito, ou digite aqui embaixo uma carga que você já levanta.</span>
      <div class="rk-ladder" role="list" aria-label="Os 9 níveis">${RLV.map(x=>`<span role="listitem">${x[0]}</span>`).join("")}</div></div>`;
  const none=Object.keys(BASIC).filter(g=>!D.gs.some(x=>x.g===g));
  const form=rForm?(()=>{const r=parseRef(rForm.ref),st=rStd(r.f,r.sel),S=RSTD[st.k];
    const lab=S[4]!=null?(st.as?"Ajuda da máquina (kg)":"Peso extra (kg, 0 = só o corpo)"):"Carga (kg)";
    return `<div class="card rk-form" id="rkForm"><h3 class="section-t" style="margin:0">Digitar carga</h3><b>${esc(rForm.name)}</b>
      <div class="rk-inps"><label><span>${lab}</span><input class="inp" id="rkKg" inputmode="decimal" placeholder="${S[4]!=null?"0":"ex.: 60"}"></label><label><span>Repetições</span><input class="inp" id="rkR" inputmode="numeric" placeholder="ex.: 8"></label></div>
      <span class="muted-s" style="margin:0">Use a série mais pesada que você faz hoje, com boa execução.${S[1]&&/cada halter/.test(S[0])?" Peso de cada halter.":""}</span>
      <div class="row"><button class="btn primary" data-ract="save">Salvar</button><button class="btn" data-ract="cancel">Cancelar</button></div></div>`})():"";
  body.innerHTML=`<div class="page-h"><button class="rk-back" data-ract="back">‹ Voltar</button><h2>Ranking de força<button class="help" data-help="rank" aria-label="Sobre esta página" title="Sobre esta página">+</button></h2>
    <p class="lead">Quanto você levanta em cada grupo muscular comparado com milhões de pessoas que treinam, do seu sexo e ajustado ao seu peso.</p></div>
  <div class="card rk-me"><label class="rk-bw"><span>Seu peso</span><span class="rk-bwi"><input class="inp" id="rkBw" inputmode="decimal" value="${rank.bw>0?fkg(rank.bw):""}" placeholder="${RSW[sex]}"><small>kg</small></span></label>
    <div class="rk-sexw"><span>Corpo</span><div class="seg sex" role="group" aria-label="Corpo"><button data-rsex="m" aria-pressed="${sex==="m"}" aria-label="Masculino" title="Masculino"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="14.5" r="5.5"/><path d="M13.5 10.5 20 4M14.5 4H20v5.5"/></svg></button><button data-rsex="f" aria-pressed="${sex==="f"}" aria-label="Feminino" title="Feminino"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="M12 14.5V22M8.5 18.5h7"/></svg></button></div></div>
    ${rank.bw>0?"":`<span class="muted-s rk-note">Coloque seu peso para o ranking ficar certo. Enquanto isso, o app usa ${RSW[sex]} kg.</span>`}</div>
  ${hero}
  ${form}
  ${has?`<div class="card"><div id="rkFigBox"></div><div class="rk-legend" role="list" aria-label="Cores dos níveis">${RLV.map((x,i)=>`<span role="listitem"><i style="background:var(--lv${i})"></i>${x[0]}</span>`).join("")}<span role="listitem"><i style="background:var(--m)"></i>Sem dados</span></div></div>`:""}
  <div class="card"><div class="row between"><h3 class="section-t" style="margin:0">Nível por grupo</h3>${has?`<span class="muted-s" style="margin:0">mais forte que</span>`:""}</div>
    ${has?D.gs.map(x=>`<details class="pg rk-g"${rOpen===x.g?" open":""} data-rg2="${x.g}"><summary><span class="pg-n">${BASIC[x.g].n}${rChip(x.s)}</span>${rBar(x.s)}<b>${rPct(x.s)}%</b></summary>
      <div class="rk-exs">${x.ex.map(o=>`<div class="rk-ex"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span class="rk-exn">${esc(o.name)}<small>${rSetTxt(o)}</small></span>${rChip(o.s)}</div>
        ${rBar(o.s)}<small class="rk-next">${rNeed(o)}</small>
        ${o.man.length?`<div class="rk-man">${o.man.map(m=>`<span>Digitado: ${fkg(m.kg)} kg × ${m.r} <button class="lnk" data-rdel="${esc(m.id)}">apagar</button></span>`).join("")}</div>`:""}</div>`).join("")}
        <span class="muted-s" style="margin:0">Nível do grupo = média de ${plural(x.ex.length,"exercício")}.</span></div></details>`).join(""):`<p class="muted">Nenhum exercício com carga ainda.</p>`}
    ${none.length&&has?`<p class="muted" style="font-size:13px">Sem dados: ${none.map(g=>BASIC[g].n).join(", ")}.</p>`:""}
    <button class="btn primary" data-ract="add">+ Digitar uma carga</button></div>
  ${D.noStd.length?`<p class="muted" style="font-size:13px">Sem padrão de força (não entram): ${D.noStd.map(esc).join(", ")}.</p>`:""}
  ${rankAbout()}`;
  if(has)$("rkFigBox").appendChild(rankFig(D.gs));
}
$("rankBody").addEventListener("click",e=>{
  const sx=e.target.closest("[data-rsex]");if(sx){setSex(sx.dataset.rsex);return renderRank()}
  const a=e.target.closest("[data-ract]");
  if(a){const k=a.dataset.ract;
    if(k==="back")return setTab(rPrev||"atlas");
    if(k==="add")return openPicker("Exercício para o ranking",(name,ref)=>{
      const r=ref&&parseRef(ref);if(!r){toast("Escolha um exercício da lista");return}
      if(!rStd(r.f,r.sel)){toast("Essa variação não tem padrão de força. Tente com barra, halteres ou máquina.");return}
      rForm={name,ref};renderRank();const fm=$("rkForm");if(fm){fm.scrollIntoView({block:"center"});setTimeout(()=>$("rkKg").focus(),60)}});
    if(k==="cancel"){rForm=null;return renderRank()}
    if(k==="save"){const r=parseRef(rForm.ref),st=rStd(r.f,r.sel),S=RSTD[st.k];
      let kg=numKg($("rkKg").value);const rp=parseInt($("rkR").value);
      if(S[4]!=null&&!isFinite(kg))kg=0;
      if(!(rp>0)||!(isFinite(kg))||(S[4]==null&&!(kg>0))){toast("Preencha a carga e as repetições");return}
      rank.man.push({id:Date.now().toString(36),ref:rForm.ref,kg:Math.abs(kg),r:rp,date:isoDate(new Date())});saveRank();
      rOpen=TOB[resolveV(r.f,r.sel).p[0]];rForm=null;renderRank();toast("Carga salva");return}
  }
  const d=e.target.closest("[data-rdel]");if(d){rank.man=rank.man.filter(m=>m.id!==d.dataset.rdel);saveRank();return renderRank()}
  const g=e.target.closest(".rfig [data-m]");if(g){const t=g.querySelector("title");toast(t?t.textContent:"")}
});
$("rankBody").addEventListener("toggle",e=>{const d=e.target.closest&&e.target.closest("[data-rg2]");if(d){if(d.open)rOpen=d.dataset.rg2;else if(rOpen===d.dataset.rg2)rOpen=null}},true);
$("rankBody").addEventListener("change",e=>{if(e.target.id!=="rkBw")return;const v=numKg(e.target.value);
  if(e.target.value.trim()===""){delete rank.bw}else if(v>=30&&v<=250){rank.bw=Math.round(v*10)/10}else{toast("Peso entre 30 e 250 kg");e.target.value=rank.bw>0?fkg(rank.bw):"";return}
  saveRank();renderRank()});
$("brandBtn").addEventListener("click",()=>{if(tab!=="rank")setTab("rank")});

function setTab(t){
  if(t==="rank"&&tab!=="rank")rPrev=tab;
  tab=t;LS.set("atlas-tab",t);
  ["atlas","ficha","treino","prog","rank"].forEach(x=>$("tab-"+x).hidden=(x!==t));
  $("brandBtn").setAttribute("aria-current",t==="rank"?"page":"false");
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));
  if(t==="ficha")renderFicha();
  if(t==="treino"){openW=null;askDel=false;hDate=null;hWeek=0;renderTreino()}
  if(t==="prog"){pOff=0;renderProg()}
  if(t==="rank"){rForm=null;renderRank();$("tab-rank").scrollTop=0}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

chips();setView(view);setModel(model);setTab(tab);
if(matchMedia("(max-width:900px)").matches)q.placeholder="Buscar";
matchMedia("(max-width:900px)").addEventListener("change",()=>setView(view));
</script>

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})});
}).catch(()=>{}))}
