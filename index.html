<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Muscular</title>
<meta name="description" content="Boneco anatômico clicável com exercícios ordenados por estudos de EMG.">
<meta name="theme-color" content="#0E1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Muscular">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: figure stage on the left (top on phones), ranked exercise panel on the right (below on phones). */
:root{
  --bg:#E9ECEF; --surface:#F7F8F9; --ink:#1A1F26; --muted:#5B6470; --line:#CDD2D8;
  --skin:#D6DADF; --m:#AEB6C0; --m-hi:#C3CAD2; --m-lo:#97A0AB; --m-edge:#E9ECEF; --fiber:rgba(26,31,38,.13);
  --target:#D3222A; --target-hi:#F04A50; --target-lo:#A0141B;
  --syn:#F08A24; --syn-soft:rgba(240,138,36,.55);
  --chip:#E1E5E9; --focus:#1A1F26; --tend:#E4E7EB;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#151A20; --ink:#E7EAEE; --muted:#8C95A1; --line:#262D36;
  --skin:#1E242C; --m:#46515E; --m-hi:#5A6674; --m-lo:#36404B; --m-edge:#151A20; --fiber:rgba(0,0,0,.28);
  --target:#E8343B; --target-hi:#FF6268; --target-lo:#A8161D;
  --syn:#F59A3C; --syn-soft:rgba(245,154,60,.5);
  --chip:#1F262E; --focus:#E7EAEE; --tend:#7A8592; color-scheme:dark}

html{height:100%}body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand h1 b{color:var(--target);font-weight:700}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.search{position:relative;margin-left:auto;flex:1;max-width:380px;min-width:0}
.search input{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:20}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .r-n{font-weight:600;font-size:14px}
.results .r-s{font-size:12px;color:var(--muted)}
.results .empty{padding:12px 14px;color:var(--muted);font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.zoom{display:inline-flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:32px;font-weight:600}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .lt{background:var(--target)} .legend .ls{background:var(--syn)}
.canvas{flex:1;min-height:0;position:relative}
#fig{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}

/* figure */
.skin{fill:var(--m-lo)}
.deco{pointer-events:none}
.dm{fill:url(#gM);stroke:var(--m-edge);stroke-width:1.4;stroke-linejoin:round}
.tend{fill:var(--tend);stroke:var(--m-edge);stroke-width:1;pointer-events:none}
.mode-art .skin,.mode-art .dm{opacity:.5}
.mode-art .tend{opacity:.6}
.m{fill:url(#gM);stroke:var(--m-edge);stroke-width:1.6;stroke-linejoin:round;transition:fill .18s}
.fib{pointer-events:none}
@media (hover:hover){[data-m]:hover .m{fill:var(--m-hi)}}
[data-m].on .m{fill:url(#gT)}
[data-m].syn .m{fill:url(#gS)}
.vlabel{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.2em;fill:var(--muted)}
.detail{fill:none;stroke:var(--m-edge);stroke-width:1.4;pointer-events:none}

/* panel */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.p-top{display:flex;align-items:flex-start;gap:10px}
.p-top > div{min-width:0;flex:1}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--target)}
.p-title{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.02;text-wrap:balance}
.p-latin{margin:4px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.clear{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.p-body{flex:1;overflow:auto;padding:14px 18px 24px;display:grid;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.status{font-size:13px;color:var(--muted);line-height:1.4}
.status b{color:var(--syn)}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ex:hover{border-color:var(--muted)}
.ex.sel{border-color:var(--syn);box-shadow:inset 0 0 0 1px var(--syn)}
.rank{grid-row:span 3;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums}
.ex[data-i="0"] .rank{color:var(--target)}
.ex-n{font-weight:600;font-size:15px;line-height:1.25}
.ex-en{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:6px;padding:3px 7px;background:var(--chip);color:var(--muted)}
.tag.hyp{background:var(--target);color:#fff}
.tag.emg{background:var(--ink);color:var(--surface)}
.tag.bio{background:none;border:1px solid var(--line)}
.tag.stat{background:none;color:var(--target);border:1px solid var(--target)}
.syns{grid-column:2;display:none;flex-wrap:wrap;gap:5px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.ex.sel .syns{display:flex}
.syns span{font-size:12px;border-radius:6px;padding:2px 8px;background:var(--syn-soft);color:var(--ink)}
.syns em{font-style:normal;font-size:12px;color:var(--muted);width:100%}

.note{font-size:13px;color:var(--muted);line-height:1.45;border-left:3px solid var(--line);padding:2px 0 2px 10px}
.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.empty button{margin-top:10px;border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:7px 12px}

.groups{display:grid;gap:16px}
.group h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group div{display:flex;flex-wrap:wrap;gap:6px}
.group button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.group button:hover{border-color:var(--target)}

details.about{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:13px;color:var(--muted)}
details.about summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.about ul{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
details.about p{margin:8px 0 0;line-height:1.45}

/* phones and narrow windows */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(300px,52%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .seg .both{display:none}
  .legend{display:none}
  .brand small{display:none}
  .p-head{padding:12px 16px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .p-title{font-size:24px}
  .bar{padding-block:8px}
  .hint{display:none}
  main{grid-template-rows:minmax(320px,56%) minmax(0,1fr)}
}
@media (max-width:480px){.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){.m{transition:none}}

/* ---- sections, tabs, pages ---- */
.app{grid-template-rows:auto minmax(0,1fr) auto}
.view{grid-row:2;min-height:0}
.htabs{display:flex;gap:4px}
.htabs button,.btabs button{border:0;background:none;color:var(--muted);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.htabs button{padding:7px 12px;border-radius:8px;font-size:15px}
.htabs button[aria-current="page"]{color:var(--ink);background:var(--chip)}
.btabs{display:none}
.page{overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;box-sizing:border-box;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.page-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;letter-spacing:.02em;line-height:1}
.lead{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.day.today{border-color:var(--target);box-shadow:inset 0 0 0 1px var(--target)}
.day-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.day-n{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;min-width:96px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--target);color:#fff;letter-spacing:.04em}
.inp{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
textarea.inp{min-height:60px;resize:vertical;font-family:var(--f-body);line-height:1.4}
.day-t{flex:1;min-width:150px}
.title-inp{font-family:var(--f-display);font-weight:700;font-size:22px;padding:6px 10px}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 62px 76px auto;gap:8px;align-items:end;padding-top:10px;border-top:1px solid var(--line)}
.fi-n{font-weight:600;font-size:15px;align-self:center;min-width:0;line-height:1.25}
.muted-s{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.fl{display:grid;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fi-act{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;font-size:15px;padding:0}
.ib.del{color:var(--target)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--target);border-color:var(--target);background:none}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.wx-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wx-h > div:first-child{min-width:0}
.wx-n{font-weight:600;font-size:16px;line-height:1.25}
.last{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px;line-height:1.4}
.last b{color:var(--ink);font-weight:600}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.set-n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set.set-h span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.hist{display:grid;gap:6px}
.hist button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}
.hist b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist span{color:var(--muted);font-size:13px;text-align:right;min-width:0}
.section-t{margin:12px 0 0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* ---- sheets ---- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-h{display:flex;gap:8px;padding:14px 16px 10px;align-items:center}
.sheet-h h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;flex:1}
.sheet-s{padding:0 16px 8px}
.sheet .chips{padding:0 16px 8px}
.plist,.alist{overflow:auto;padding:4px 16px 18px;display:grid;gap:6px;align-content:start}
.plist button,.alist button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.pn{display:block;font-weight:600;font-size:14px}
.ps{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.plist .custom{border-style:dashed}
.alist .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---- exercise card add button ---- */
.ex{grid-template-columns:auto minmax(0,1fr) auto;cursor:pointer;box-sizing:border-box}
.addx{grid-column:3;grid-row:1 / span 2;align-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;padding:0;color:var(--ink)}
.syns{grid-column:2 / span 2}

/* ---- models ---- */
.joints{display:none}
.mode-art .joints{display:inline}
.mode-art [data-m]{pointer-events:none}
.mode-art .m{fill:var(--m-lo);opacity:.5}
.mode-art .fib{opacity:.4}
.jt{cursor:pointer}
.jt .jh{fill:transparent}
.jt .jd{fill:var(--surface);stroke:var(--syn);stroke-width:3}
.jt.on .jd{fill:var(--target);stroke:var(--target-hi)}
@media (hover:hover){.jt:hover .jd{fill:var(--syn-soft)}}
.jl{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.jl h4{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.jl.warm h4{color:var(--syn)} .jl.mob h4{color:var(--ink)} .jl.str h4{color:var(--target)}
.jl ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px;line-height:1.35}
.jl small{display:block;color:var(--muted);font-size:12px;margin:-4px 0 8px}

@media (max-width:900px){
  .htabs{display:none}
  .btabs{display:grid;grid-row:3;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .btabs button{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;font-size:13px}
  .btabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btabs button[aria-current="page"]{color:var(--target)}
  .seg.model{width:100%}
  .seg.model button{flex:1;padding:6px 4px;font-size:14px;letter-spacing:.03em}
  .fi{grid-template-columns:minmax(0,1fr) 58px 70px}
  .fi-act{grid-column:1 / -1;justify-content:flex-end}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:901px){.modal{align-items:center}.sheet{border-radius:16px}}

/* phone: figure fills the screen until something is picked */
@media (max-width:900px){
  #tab-atlas{display:flex;flex-direction:column}
  #tab-atlas .stage{flex:0 0 56%;min-height:0;transition:flex-basis .35s ease}
  #tab-atlas .panel{flex:1 1 0;min-height:0}
  #tab-atlas.idle .stage{flex-basis:calc(100% - 84px)}
  #tab-atlas.idle .p-latin,#tab-atlas.idle .chips,#tab-atlas.idle .p-body{display:none}

/* ------------------------------------------------------- view, zoom, pan */
let view=(()=>{try{const v=localStorage.getItem("atlas-view");return ["front","back","both"].includes(v)?v:"front"}catch(e){return "front"}})();
let vb=[...BOX[view]];
const narrow=()=>matchMedia("(max-width:900px)").matches;
function applyVB(){svg.setAttribute("viewBox",vb.map(n=>n.toFixed(2)).join(" "))}
function setView(v,keepZoom){
  if(v==="both"&&narrow())v="front";
  view=v;try{localStorage.setItem("atlas-view",v)}catch(e){}
  document.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));
  VG.front.style.display=(v==="back")?"none":"";VG.back.style.display=(v==="front")?"none":"";
  if(!keepZoom){vb=[...BOX[v]];applyVB()}
}
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,cx,cy){
  const base=BOX[view];const minW=base[2]/6;
  let nw=Math.min(base[2],Math.max(minW,vb[2]/f));const k=nw/vb[2];
  const p=(cx===undefined)?{x:vb[0]+vb[2]/2,y:vb[1]+vb[3]/2}:toSvg(cx,cy);
  vb=[p.x-(p.x-vb[0])*k,p.y-(p.y-vb[1])*k,vb[2]*k,vb[3]*k];clampVB();applyVB();
}
function clampVB(){
  const b=BOX[view];
  if(vb[2]>=b[2]-0.5){vb=[...b];return}
  vb[0]=Math.min(Math.max(vb[0],b[0]-vb[2]*0.3),b[0]+b[2]-vb[2]*0.7);
  vb[1]=Math.min(Math.max(vb[1],b[1]-vb[3]*0.3),b[1]+b[3]-vb[3]*0.7);
}

document.getElementById("zReset").onclick=()=>{vb=[...BOX[view]];applyVB()};

const ptrs=new Map();let gesture=null;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===1){gesture={type:"tap",sx:e.clientX,sy:e.clientY,target:e.target.closest("[data-j],[data-m]"),vb0:[...vb],t:Date.now()}}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gesture={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y),vb0:[...vb],mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId)||!gesture)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const scale=vb[2]/svg.getBoundingClientRect().width*Math.max(1,(svg.getBoundingClientRect().width/svg.getBoundingClientRect().height)/(vb[2]/vb[3]));
  if(gesture.type!=="pinch"&&ptrs.size===1){
    const dx=e.clientX-gesture.sx,dy=e.clientY-gesture.sy;
    if(gesture.type==="tap"&&Math.hypot(dx,dy)>8)gesture.type="pan";
    if(gesture.type==="pan"){
      const k=svgUnitsPerPx(gesture.vb0);
      vb=[gesture.vb0[0]-dx*k,gesture.vb0[1]-dy*k,vb[2],vb[3]];clampVB();applyVB();
    }
  }else if(gesture.type==="pinch"&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    vb=[...gesture.vb0];applyVB();zoomAt(d/gesture.d0,gesture.mid.x,gesture.mid.y);
  }
});
function svgUnitsPerPx(box){const r=svg.getBoundingClientRect();return Math.max(box[2]/r.width,box[3]/r.height)}
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(gesture&&gesture.type==="tap"&&ptrs.size===0){
    if(gesture.target)onFigTap(gesture.target);
  }
  if(ptrs.size===0)gesture=null;
  else if(ptrs.size===1&&gesture&&gesture.type==="pinch"){const p=[...ptrs.values()][0];gesture={type:"pan",sx:p.x,sy:p.y,vb0:[...vb]}}
}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);

    const done=it.sets.filter(s=>s.r!==""||s.kg!=="");if(done.length)return {date:p.date,sets:done}}

}

      <div class="sets"><div class="set set-h"><span></span><span>Reps</span><span>Carga (kg)</span><span></span></div>
      ${it.sets.map((s,j)=>`<div class="set"><span class="set-n">${j+1}</span>
        <input class="inp" inputmode="numeric" data-i="${i}" data-s="${j}" data-sf="r" value="${esc(s.r)}" placeholder="${esc(it.target||"reps")}" aria-label="Repetições, série ${j+1}">
        <input class="inp" inputmode="decimal" data-i="${i}" data-s="${j}" data-sf="kg" value="${esc(s.kg)}" placeholder="kg" aria-label="Carga em kg, série ${j+1}">
        <button class="ib del" data-act="rmSet" data-i="${i}" data-s="${j}" aria-label="Remover série ${j+1}">✕</button></div>`).join("")}</div>

const curW=()=>workouts.find(x=>x.id===openW);
$("treinoBody").addEventListener("input",e=>{
  const t=e.target,w=curW();if(!w)return;
  if(t.dataset.wf)w[t.dataset.wf]=t.value;
  else if(t.dataset.sf)w.items[+t.dataset.i].sets[+t.dataset.s][t.dataset.sf]=t.value;
  else if(t.dataset.if)w.items[+t.dataset.i][t.dataset.if]=t.value;
  else return;
  saveW();
});
$("treinoBody").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){openW=o.dataset.open;askDel=false;renderTreino();$("tab-treino").scrollTop=0;return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const w=curW(),a=b.dataset.act,i=+b.dataset.i;
  if(a==="startFicha"||a==="startFree"){const nw=startToday(a==="startFicha");openW=nw.id}
  else if(a==="toToday"){openW=null;askDel=false}
  else if(a==="addEx")return openPicker("Adicionar ao treino",name=>{w.items.push(mkItem(name,3,""));saveW();renderTreino()});
  else if(a==="addSet"){const s=w.items[i].sets,l=s[s.length-1];s.push({r:"",kg:l?l.kg:""})}
  else if(a==="rmSet"){w.items[i].sets.splice(+b.dataset.s,1);if(!w.items[i].sets.length)w.items[i].sets.push({r:"",kg:""})}
  else if(a==="rmItem")w.items.splice(i,1);
  else if(a==="up"&&i>0)[w.items[i-1],w.items[i]]=[w.items[i],w.items[i-1]];
  else if(a==="down"&&i<w.items.length-1)[w.items[i+1],w.items[i]]=[w.items[i],w.items[i+1]];
  else if(a==="askDel")askDel=true;
  else if(a==="noDel")askDel=false;
  else if(a==="del"){workouts=workouts.filter(x=>x.id!==w.id);openW=null;askDel=false;toast("Treino excluído")}
  else if(a==="export")return exportBackup();
  else if(a==="import")return $("importFile").click();
  else if(a==="doImport"){ficha=pendingImport.ficha;workouts=pendingImport.workouts;pendingImport=null;openW=null;saveFicha();saveW();toast("Backup importado")}
  else if(a==="noImport")pendingImport=null;
  saveW();renderTreino();
});
function exportBackup(){
  const data=JSON.stringify({app:"atlas-muscular",version:1,exported:new Date().toISOString(),ficha,workouts});
  const name=`atlas-backup-${isoDate(new Date())}.json`;
  let file;try{file=new File([data],name,{type:"application/json"})}catch(e){file=null}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Backup do Atlas Muscular"}).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d.app!=="atlas-muscular"||!d.ficha||!Array.isArray(d.ficha.days)||d.ficha.days.length!==7||!Array.isArray(d.workouts))throw 0;
    pendingImport={ficha:d.ficha,workouts:d.workouts};renderTreino();
  }catch(_){toast("Esse arquivo não é um backup do Atlas Muscular")}
});

/* ---------------------------------------------------------- tabs + init */
let tab=LS.get("atlas-tab","atlas");if(!["atlas","ficha","treino"].includes(tab))tab="atlas";
function setTab(t){
  tab=t;LS.set("atlas-tab",t);
  ["atlas","ficha","treino"].forEach(x=>$("tab-"+x).hidden=(x!==t));
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));
  if(t==="ficha")renderFicha();
  if(t==="treino"){openW=null;askDel=false;renderTreino()}
}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

chips();setView(view);setModel(model);setTab(tab);
if(matchMedia("(max-width:900px)").matches)q.placeholder="Buscar";
matchMedia("(max-width:900px)").addEventListener("change",()=>setView(view));
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})});
}).catch(()=>{}))}
</script>
